# The chronicle CLI as a fluxor cli-applet (rfc_cli_execution.md): one PIC
# module (chronicle_cli) dispatches subcommands (check, eval, digest, help)
# over the cli host surface. Install + run:
#   fluxor install packaging/cli/workload.toml
#   fluxor exec chronicle -- check <ir_hex>
target: linux
tick_us: 100

platform:
  cli: {}

modules:
  - name: chronicle_cli

wiring:
  - from: cli_in.args_out
    to: chronicle_cli.args
  - from: chronicle_cli.stdout
    to: cli_out.bytes_in
  - from: chronicle_cli.exit
    to: cli_out.exit_in
