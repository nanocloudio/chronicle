# The chronicle CLI as a fluxor cli-applet: one PIC module (chronicle_cli)
# dispatches every chronicle subcommand over the cli host surface (`help` lists
# them). Install + run:
#   fluxor install packaging/cli/workload.toml
#   fluxor exec chronicle -- check <ir_hex>
target: linux
tick_us: 100

platform:
  cli: {}

modules:
  - name: chronicle_cli

wiring:
  - from: cli_in.args_out
    to: chronicle_cli.args
  - from: chronicle_cli.stdout
    to: cli_out.bytes_in
  - from: chronicle_cli.exit
    to: cli_out.exit_in
