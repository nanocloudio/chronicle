# Clippy configuration for the PIC module sources.
#
# `fluxor ci` lints `modules/**` with `clippy-driver`, which reads this file
# (there is no `Cargo.toml`). `msrv` is the load-bearing key: without it clippy
# assumes the installed toolchain, so which lints fire would depend on whoever
# runs the build.
#
# 1.87, above the 1.81 floor in ../standards/lints.md §0, because the modules use
# `u64::is_multiple_of` (stable since 1.87) in `hex_core`, `agg_core`,
# `deser_core` and `chronicle_cli`. Raise it only alongside a decision about
# which silicon toolchains must still build Chronicle.
msrv = "1.87"
