version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "rp2040", "rp2350"]
# Cadence-independent: a pure record transform with no notion of time at all.
timer_class     = "agnostic"


# Input: one typed record frame (the canonical `pipeline_core` frame) per unit,
# admitted whole via peek — never partially. `max_record` is the largest frame the
# module admits; `buffer_size` is the ring the producer edge must be granted so an
# all-or-nothing write of a max_record frame can never permanently wedge.
# Feature-set variants. The pinned CEL extension surface
# (modules/common/builtins_core.rs) is cfg-gated per extension at TOP
# LEVEL — strings, math, encoders, bindings — so a variant can compose
# subsets for constrained targets. `full` is the default and carries all four; it
# emits the unsuffixed .fmod, so a graph that names the module without naming a
# variant gets the whole surface. A build without a feature rejects that
# extension's programs FAIL-CLOSED at runtime (BadBuiltin / BadOpcode), never
# silently.
[[variant]]
name     = "full"
features = ["strings", "math", "encoders", "bindings"]
default  = true

[[ports]]
name         = "record_in"
direction    = "input"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

# Output: the evaluated scalar result bytes (here, the selected string field).
[[ports]]
name         = "result_out"
direction    = "output"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

[observability]
# The common accounting taxonomy is front-loaded (ids 0..13, canonical field
# order in accounting_core.rs) so the array index equals the emit id; the module's
# own instruments follow. `module_mode` is the closed operating-mode gauge;
# `faulted` is the 0/1 init/reload configuration-fault flag.
metrics = [
    "bytes_in", "bytes_out",
    "inputs_observed", "inputs_admitted", "inputs_rejected",
    "inputs_succeeded", "inputs_policy_dropped", "inputs_failed", "inputs_in_flight",
    "outputs_generated", "outputs_delivered", "outputs_pending", "outputs_failed",
    "pending_output_bytes",
    "module_mode", "faulted", "work_units",
]
