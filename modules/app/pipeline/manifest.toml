version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "rp2350", "rp2040"]
# Cadence-independent: a pure record transform. Stages run over the record in
# front of them; telemetry reads the device clock, never the tick count.
timer_class     = "agnostic"

# As a provider (`request_in` with `ack`), each collected request is answered
# once its record has been processed and the result accepted downstream.
capabilities = ["stream.ordered_ack.sink"]

# Feature-set variants. The pinned CEL extension surface
# (modules/common/builtins_core.rs) is cfg-gated per extension at TOP
# LEVEL — strings, math, encoders, bindings — so a variant can compose
# subsets for constrained targets. `full` is the default and carries all four; it
# emits the unsuffixed .fmod, so a graph that names the module without naming a
# variant gets the whole surface. A build without a feature rejects that
# extension's programs FAIL-CLOSED at runtime (BadBuiltin / BadOpcode), never
# silently.
[[variant]]
name     = "full"
features = ["strings", "math", "encoders", "bindings"]
default  = true

# Input: a typed record frame (see mod.rs / pipeline_core.rs `decode_frame`):
# [count:u8] then count × [number:u8][type:u8][len:u16 LE][payload], where
# type 0 = byte string, type 1 = i64 (8 bytes LE) and type 3 = a nested
# message (its own frame).
[[ports]]
name         = "record_in"
direction    = "input"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

# Output: the final stage's constructed message, in the same typed record frame.
[[ports]]
name         = "result_out"
direction    = "output"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

# ── Exchange ports ──────────────────────────────────────────────────────
#
# The exchange contract's records (the SDK's `contracts/exchange.rs`). Every
# port is optional; which are wired chooses the role (`exchange_core.rs`):
#
#   provider   request_in + response_out   each request collected whole becomes
#              a record; `ack` answers it with its status once the record
#              resolves, otherwise a node downstream answers it by its id
#   answer     response_out + `answer`     the result is the response
#   requester  request_out + response_in   the result is a request this node
#              correlates; each answer becomes a record on `result_out`, with
#              the request's carry (254) restored and its status at 253
#   relay      all four                    a request HEAD is rewritten under the
#              same id and every other record of the exchange forwarded each
#              way; a request it cannot pass on, or whose stages name a
#              status, it answers itself
#              response_in + response_out  another node's answers pass through
#
# An exchange record is at most the contract's 8192 bytes; a tiny target takes
# 1024. Exchange edges are mailbox edges, one record per write.
[[ports]]
name         = "request_out"
index        = 1
direction    = "output"
content_type = "ExchangeRequest"
max_record   = { default = 8192, rp2040 = 1024 }
buffer_size  = { default = 16384, rp2040 = 2048 }

[[ports]]
name         = "response_in"
index        = 1
direction    = "input"
content_type = "ExchangeResponse"
max_record   = { default = 8192, rp2040 = 1024 }
buffer_size  = { default = 16384, rp2040 = 2048 }

[[ports]]
name         = "request_in"
index        = 2
direction    = "input"
content_type = "ExchangeRequest"
max_record   = { default = 8192, rp2040 = 1024 }
buffer_size  = { default = 16384, rp2040 = 2048 }

[[ports]]
name         = "response_out"
index        = 2
direction    = "output"
content_type = "ExchangeResponse"
max_record   = { default = 8192, rp2040 = 1024 }
buffer_size  = { default = 16384, rp2040 = 2048 }

# Control: hot-reload ops for the version table (add a version / flip the default
# / remove a drained one). See version_core.rs `vctl`. Optional — a config that
# doesn't wire it just runs the versions loaded at startup.
[[ports]]
name         = "control"
direction    = "ctrl_input"
content_type = "OctetStream"
max_record   = 4096
buffer_size  = 4096

[observability]
# Baseline accounting (ids 0..13, canonical order) front-loaded so index == id,
# then pipeline's own instruments: `module_mode`, the init/reload fault flag,
# the two reload-CONTROL counters (accepted/rejected hot-reload messages — control,
# not record dispositions), and `unavailable` (a refinement of which succeeded inputs
# were routed to the fail-closed VERSION_UNAVAILABLE marker).
metrics = [
    "bytes_in", "bytes_out",
    "inputs_observed", "inputs_admitted", "inputs_rejected",
    "inputs_succeeded", "inputs_policy_dropped", "inputs_failed", "inputs_in_flight",
    "outputs_generated", "outputs_delivered", "outputs_pending", "outputs_failed",
    "pending_output_bytes",
    "module_mode", "faulted", "reloads", "rejected", "unavailable", "work_units",
    # Requester: the in-flight window (gauge), answers with a status of 400 or
    # above, answers turned into records and answers that could not be,
    # requests sent again after a LINK_DOWN, and LINK_DOWN signals seen.
    "inflight", "refused", "answers", "answers_failed", "replayed", "link_downs",
    # Provider: requests answered as a sink, and requests refused.
    "answered", "requests_refused",
    # Records forwarded untouched as a relay; records whose carry did not fit;
    # records refused for exceeding the field table or a map stage's maximum.
    "relayed", "carry_refused", "over_bound",
]

# The sink role's terms. `transport`: a 200 means the record's output was
# accepted by the next channel — handed on, not made durable; one destination
# is one ordering unit, so a broadcast is a plain request; a whole contract
# payload is collected, one record's on a tiny target.
[capability_facts."stream.ordered_ack.sink"]
ack         = "transport"
ordering    = "single"
broadcast   = "degenerate"
max_payload = { default = 8192, rp2040 = 512 }

# The largest body a pipeline result can carry, against a provider's declared
# backend ceiling: one record.
[capability_facts."stream.ordered_ack"]
max_payload = { default = 4096, rp2040 = 512 }
