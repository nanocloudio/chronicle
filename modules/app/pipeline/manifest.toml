version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712"]


# Input: a typed record frame (see mod.rs / pipeline_core.rs `decode_frame`):
# [count:u8] then count × [number:u8][type:u8][len:u16 LE][payload], where
# type 0 = byte string and type 1 = i64 (8 bytes LE).
# Feature-set variants (fluxor RFC module_variants). The pinned CEL extension
# surface (modules/common/builtins_core.rs) is cfg-gated per extension at TOP
# LEVEL — strings, math, encoders, bindings — so later variants can compose
# subsets for constrained targets. `full` (default) carries all four and emits
# the unsuffixed .fmod, so every existing graph and pin resolves unchanged. A
# build without a feature rejects that extension's programs FAIL-CLOSED at
# runtime (BadBuiltin / BadOpcode), never silently.
[[variant]]
name     = "full"
features = ["strings", "math", "encoders", "bindings"]
default  = true

[[ports]]
name         = "record_in"
direction    = "input"
content_type = "OctetStream"

# Output: the final stage's constructed message, in the same typed record frame.
[[ports]]
name         = "result_out"
direction    = "output"
content_type = "OctetStream"

# Control: hot-reload ops for the version table (add a version / flip the default
# / remove a drained one). See version_core.rs `vctl`. Optional — a config that
# doesn't wire it just runs the versions loaded at startup.
[[ports]]
name         = "control"
direction    = "ctrl_input"
content_type = "OctetStream"

[observability]
# Counters live in module state (the token_verify convention); `faulted`
# is a 0/1 gauge set by a named configuration fault at init/reload.
metrics = ["processed", "errors", "reloads", "rejected", "unavailable", "faulted"]

