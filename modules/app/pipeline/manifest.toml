version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "rp2350", "rp2040"]
# Cadence-independent: a pure record transform. Stages run over the record in
# front of them; telemetry reads the device clock, never the tick count.
timer_class     = "agnostic"

# The sink role of the ordered-ack exchange surface: a producer wired to
# `publish_in` gets every publish answered on `ack_out` once its payload has
# been processed and the result accepted downstream. See the ingress ports.
capabilities = ["stream.ordered_ack.sink"]

# Feature-set variants. The pinned CEL extension surface
# (modules/common/builtins_core.rs) is cfg-gated per extension at TOP
# LEVEL — strings, math, encoders, bindings — so a variant can compose
# subsets for constrained targets. `full` is the default and carries all four; it
# emits the unsuffixed .fmod, so a graph that names the module without naming a
# variant gets the whole surface. A build without a feature rejects that
# extension's programs FAIL-CLOSED at runtime (BadBuiltin / BadOpcode), never
# silently.
[[variant]]
name     = "full"
features = ["strings", "math", "encoders", "bindings"]
default  = true

# Input: a typed record frame (see mod.rs / pipeline_core.rs `decode_frame`):
# [count:u8] then count × [number:u8][type:u8][len:u16 LE][payload], where
# type 0 = byte string, type 1 = i64 (8 bytes LE) and type 3 = a nested
# message (its own frame).
[[ports]]
name         = "record_in"
direction    = "input"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

# Output: the final stage's constructed message, in the same typed record frame.
[[ports]]
name         = "result_out"
direction    = "output"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

# ── Egress: the ordered-ack exchange surface ──────────────────────────
#
# When wired, a pipeline's result leaves as a `Publish` frame instead of a
# bare record on `result_out`, and the destination answers on `ack_in`. That is
# what lets one pipeline publish to an MQTT topic, a Kafka partition, a table
# or an HTTP endpoint by changing which provider the graph pins — the pipeline
# never learns which.
#
# Both are optional. A graph wiring neither delivers results on `result_out`.
# The pipeline is an at-most-once producer on this surface: it holds no replay
# log, so publishes outstanding at a LINK_DOWN are counted (`invalidated`), not
# re-sent.
[[ports]]
name         = "publish_out"
index        = 1
direction    = "output"
content_type = "OctetStream"
# The peer on this wire must provide the surface. Checked at build, on the
# edge — not "some module in the graph declares it".
requires_capability = "stream.ordered_ack"
# One framed publish at this module's ceiling: the 3-byte envelope, the
# contract's 13-byte overhead, the carry as msg_key (`KEY_BUF`: 512, 64 on a
# tiny target) and a 4096-byte result frame. See `PUB_FRAME_MAX` in mod.rs.
max_record   = { default = 4624, rp2040 = 592 }
buffer_size  = { default = 18496, rp2040 = 2368 }

[[ports]]
name         = "ack_in"
index        = 1
direction    = "input"
content_type = "OctetStream"
max_record   = 12
buffer_size  = 512

# ── Ingress: the sink role ─────────────────────────────────────────────
#
# When wired, records arrive as `Publish` payloads on `publish_in` instead of
# on `record_in`, and each publish is answered on `ack_out`: OK once the
# record's output is accepted downstream, OVERSIZE for a payload beyond the
# contract ceiling, UNROUTABLE when the payload cannot be processed. LINK_UP
# is announced once the module is ready to take records; it never goes down.
# A payload is taken whole up to `INGRESS_BUF` — PAYLOAD_MAX, or one 512-byte
# record on a tiny target — as a raw chunk for the `decode` program, or, without
# one, itself one typed record. A larger payload is answered OVERSIZE.
[[ports]]
name         = "publish_in"
index        = 2
direction    = "input"
content_type = "OctetStream"
# Any producer's frame, whole: PUBLISH_FRAME_MAX + the 3-byte envelope. On a
# tiny target: the envelope, the 13-byte overhead, a KEY_MAX (512) key — read
# past, never buffered — and the 512-byte `INGRESS_BUF` payload.
max_record   = { default = 8720, rp2040 = 1040 }
buffer_size  = { default = 34880, rp2040 = 4160 }

[[ports]]
name         = "ack_out"
index        = 2
direction    = "output"
content_type = "OctetStream"
max_record   = 12
buffer_size  = 512

# ── Replies: the exchange role's answers ───────────────────────────
#
# When a replying destination (`stream.ordered_ack.exchange`) is wired back
# here, each reply IS the ack for its publish: it frees the in-flight window
# and becomes a record on `result_out` — the payload through `reply_decode`
# (or itself one record frame), the echoed msg_key restored as the carry
# (field 254), the exchange status at 253. The request's context crossed the
# destination in the key, so nothing is held here between the two.
[[ports]]
name         = "reply_in"
index        = 3
direction    = "input"
content_type = "OctetStream"
# A whole reply frame: `REPLY_BUF` (REPLY_FRAME_MAX; on a tiny target the
# 13-byte overhead, the 64-byte carry and a 512-byte record) + the 3-byte
# envelope.
max_record   = { default = 8720, rp2040 = 592 }
buffer_size  = { default = 17440, rp2040 = 1184 }

# Control: hot-reload ops for the version table (add a version / flip the default
# / remove a drained one). See version_core.rs `vctl`. Optional — a config that
# doesn't wire it just runs the versions loaded at startup.
[[ports]]
name         = "control"
direction    = "ctrl_input"
content_type = "OctetStream"
max_record   = 4096
buffer_size  = 4096

[observability]
# Baseline accounting (ids 0..13, canonical order) front-loaded so index == id,
# then pipeline's own instruments: `module_mode`, the init/reload fault flag,
# the two reload-CONTROL counters (accepted/rejected hot-reload messages — control,
# not record dispositions), and `unavailable` (a refinement of which succeeded inputs
# were routed to the fail-closed VERSION_UNAVAILABLE marker).
metrics = [
    "bytes_in", "bytes_out",
    "inputs_observed", "inputs_admitted", "inputs_rejected",
    "inputs_succeeded", "inputs_policy_dropped", "inputs_failed", "inputs_in_flight",
    "outputs_generated", "outputs_delivered", "outputs_pending", "outputs_failed",
    "pending_output_bytes",
    "module_mode", "faulted", "reloads", "rejected", "unavailable", "work_units",
    # Egress: the in-flight window (gauge), typed refusals, publishes
    # invalidated by a LINK_DOWN, and LINK_DOWN signals seen.
    "inflight", "refused", "invalidated", "link_downs",
    # Ingress: publishes accepted and refused as a sink.
    "sink_acked", "sink_refused",
    # Replies taken as records, replies that could not be, and records whose
    # carry did not fit a msg_key (appended: ids are wire positions).
    "replies", "replies_failed", "carry_refused",
    # Records refused for exceeding the field table or a map stage's maximum.
    "over_bound",
]

# The sink role's terms. `transport`: an ack means the record's output was
# accepted by the next channel — handed on, not made durable; one destination
# is one ordering unit, so a broadcast is a plain publish; any contract
# payload is taken (`INGRESS_BUF`). Capability facts take no per-target value:
# these are the full-tier ceilings; a tiny target takes a 512-byte payload and
# answers a larger one OVERSIZE.
[capability_facts."stream.ordered_ack.sink"]
ack        = "transport"
ordering   = "single"
broadcast  = "degenerate"
max_payload = 8192

# The largest payload a pipeline result can carry, against a provider's
# declared backend ceiling. Fact against fact: `max_record` above frames a
# whole record, this is the payload alone (512 on a tiny target; see above).
[capability_facts."stream.ordered_ack"]
max_payload = 4096
