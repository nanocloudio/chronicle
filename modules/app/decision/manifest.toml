version          = "0.1.0"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["bcm2712", "rp2040", "rp2350"]
# Cadence-independent: a pure record transform. It evaluates rules over the
# record in front of it and never measures time in ticks, so a variable-cadence
# domain cannot change what it decides — only when it gets to decide it.
timer_class     = "agnostic"


# Input: one typed record frame (see pipeline_core.rs). The decision evaluates
# its first-hit rules over this record.
# Feature-set variants. The pinned CEL extension surface
# (modules/common/builtins_core.rs) is cfg-gated per extension at TOP
# LEVEL — strings, math, encoders, bindings — so a variant can compose
# subsets for constrained targets. `full` is the default and carries all four; it
# emits the unsuffixed .fmod, so a graph that names the module without naming a
# variant gets the whole surface. A build without a feature rejects that
# extension's programs FAIL-CLOSED at runtime (BadBuiltin / BadOpcode), never
# silently.
[[variant]]
name     = "full"
features = ["strings", "math", "encoders", "bindings"]
default  = true

[[ports]]
name         = "record_in"
direction    = "input"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

# Output: the selected outcome as a typed record frame — the first rule whose
# `when` predicate holds constructs its outcome, else the default outcome.
[[ports]]
name         = "result_out"
direction    = "output"
content_type = "OctetStream"
max_record   = { default = 4096, rp2040 = 512 }
buffer_size  = { default = 4096, rp2040 = 512 }

[observability]
# Baseline accounting (ids 0..13, canonical order) front-loaded so index == id,
# then decision's own instruments: `module_mode`, the init/reload fault flag,
# the two failure-reason splits that refine `inputs_failed`, and the `Fired` audit
# — `no_match` count and `last_rule` (0xFFFF = the default).
metrics = [
    "bytes_in", "bytes_out",
    "inputs_observed", "inputs_admitted", "inputs_rejected",
    "inputs_succeeded", "inputs_policy_dropped", "inputs_failed", "inputs_in_flight",
    "outputs_generated", "outputs_delivered", "outputs_pending", "outputs_failed",
    "pending_output_bytes",
    "module_mode", "faulted", "errors_frame", "errors_encode", "no_match", "last_rule", "work_units",
]
