# Artifact Distribution Gateway
# This fixture implements an OCI-compatible registry API using Chronicle.
# Protocol-specific terms (v2, manifests, blobs, Docker-Distribution-API-Version)
# are allowed only in this file.

version: 1

connectors:
  - name: gateway_http
    type: http_server
    options:
      host: "0.0.0.0"
      port: 5000

  - name: auth_store
    type: redis
    options:
      url: "redis://127.0.0.1:6379"
    pool:
      max_connections: 16

  - name: metadata_db
    type: postgres
    options:
      url: "postgres://chronicle:chronicle@127.0.0.1:5432/chronicle"
    pool:
      max_connections: 16

  - name: blob_store
    type: object_store
    options:
      backend: filesystem
      root: "./tmp/artifacts"

chronicles:
  # Discovery endpoint - GET /v2/
  - name: gateway_discovery
    trigger:
      connector: gateway_http
      options:
        method: GET
        path: /v2/
    phases:
      - name: build_response
        type: transform
        options:
          status: 200
          contentType: application/json
          headers:
            Docker-Distribution-API-Version: registry/2.0
          body:
            ok: true

  # Get Manifest - GET /v2/{namespace}/{name}/manifests/{reference}
  - name: gateway_get_manifest
    trigger:
      connector: gateway_http
      options:
        method: GET
        path: /v2/{namespace}/{name}/manifests/{reference}
    phases:
      - name: extract_params
        type: transform
        options:
          namespace: .[0].http.path_params.namespace
          name: .[0].http.path_params.name
          reference: .[0].http.path_params.reference
      - name: query_manifest
        type: postgres_query
        options:
          connector: metadata_db
          sql: |
            SELECT media_type, json, digest, size
            FROM manifests
            WHERE namespace = $1 AND name = $2 AND reference = $3
          params:
            - .[1].namespace
            - .[1].name
            - .[1].reference
      - name: build_response
        type: transform
        options:
          status: .[2].rows | if length == 0 then 404 else 200 end
          contentType: .[2].rows | if length == 0 then "application/json" else .[0].media_type end
          headers:
            Docker-Content-Digest: .[2].rows | if length == 0 then null else .[0].digest end
          body: .[2].rows | if length == 0 then {error: "not_found"} else null end
          body_raw_json: .[2].rows | if length > 0 then .[0].json else null end

  # Put Manifest - PUT /v2/{namespace}/{name}/manifests/{reference}
  - name: gateway_put_manifest
    trigger:
      connector: gateway_http
      options:
        method: PUT
        path: /v2/{namespace}/{name}/manifests/{reference}
        content_type: application/json
    phases:
      - name: extract_params
        type: transform
        options:
          token: .[0].http.headers.authorization // "" | sub("^[Bb]earer\\s+"; "")
          namespace: .[0].http.path_params.namespace
          name: .[0].http.path_params.name
          reference: .[0].http.path_params.reference
      - name: check_token
        type: redis
        options:
          connector: auth_store
          command: GET
          arguments:
            - '"token:" + .[1].token'
      - name: validate_auth
        type: transform
        options:
          ok: |
            if (.[1].token | length) == 0 then false
            elif (.[2].value == null) then false
            else
              (.[2].value | fromjson) as $t
              | if (($t.scopes // []) | index("write")) == null then false
                elif (($t.namespaces // []) | index(.[1].namespace)) == null then false
                else true
                end
            end
          reason: |
            if (.[1].token | length) == 0 then "missing_token"
            elif (.[2].value == null) then "invalid_token"
            else
              (.[2].value | fromjson) as $t
              | if (($t.scopes // []) | index("write")) == null then "missing_scope"
                elif (($t.namespaces // []) | index(.[1].namespace)) == null then "forbidden_namespace"
                else null
                end
            end
      - name: auth_guard
        type: guard
        options:
          condition: .[3].ok
          response:
            status: 401
            contentType: application/json
            body:
              error: .[3].reason
      - name: compute_digest
        type: transform
        options:
          manifest_bytes_b64: .[0].http.body_b64
          media_type: .[0].http.headers.content_type // "application/vnd.oci.image.manifest.v1+json"
          digest: '"sha256:" + (.[0].http.body_b64 | @base64d | sha256)'
          size: .[0].http.body_b64 | @base64d | length
      - name: upsert_manifest
        type: postgres_exec
        options:
          connector: metadata_db
          sql: |
            INSERT INTO manifests(namespace, name, reference, media_type, json, digest, size)
            VALUES ($1, $2, $3, $4, $5, $6, $7)
            ON CONFLICT (namespace, name, reference)
            DO UPDATE SET media_type=EXCLUDED.media_type, json=EXCLUDED.json, digest=EXCLUDED.digest, size=EXCLUDED.size, updated_at=NOW()
          params:
            - .[1].namespace
            - .[1].name
            - .[1].reference
            - .[5].media_type
            - .[5].manifest_bytes_b64 | @base64d
            - .[5].digest
            - .[5].size
      - name: build_response
        type: transform
        options:
          status: 201
          contentType: application/json
          headers:
            Docker-Content-Digest: .[5].digest
          body:
            ok: true
            digest: .[5].digest

  # Get Blob - GET /v2/{namespace}/{name}/blobs/{digest}
  - name: gateway_get_blob
    trigger:
      connector: gateway_http
      options:
        method: GET
        path: /v2/{namespace}/{name}/blobs/{digest}
    phases:
      - name: extract_params
        type: transform
        options:
          namespace: .[0].http.path_params.namespace
          name: .[0].http.path_params.name
          digest: .[0].http.path_params.digest
          key: .[0].http.path_params.namespace + "/" + .[0].http.path_params.name + "/blobs/" + .[0].http.path_params.digest
      - name: fetch_blob
        type: object_store_get
        options:
          connector: blob_store
          path: .[1].key
      - name: build_response
        type: transform
        options:
          status: if .[2].found then 200 else 404 end
          contentType: if .[2].found then "application/octet-stream" else "application/json" end
          headers:
            Docker-Content-Digest: if .[2].found then .[1].digest else null end
          body: if .[2].found then null else {error: "not_found"} end
          body_b64: if .[2].found then .[2].bytes_b64 else null end

  # Start Blob Upload - POST /v2/{namespace}/{name}/blobs/uploads/
  - name: gateway_start_blob_upload
    trigger:
      connector: gateway_http
      options:
        method: POST
        path: /v2/{namespace}/{name}/blobs/uploads/
    phases:
      - name: extract_params
        type: transform
        options:
          token: .[0].http.headers.authorization // "" | sub("^[Bb]earer\\s+"; "")
          namespace: .[0].http.path_params.namespace
          name: .[0].http.path_params.name
      - name: check_token
        type: redis
        options:
          connector: auth_store
          command: GET
          arguments:
            - '"token:" + .[1].token'
      - name: validate_auth
        type: transform
        options:
          ok: |
            if (.[1].token | length) == 0 then false
            elif (.[2].value == null) then false
            else
              (.[2].value | fromjson) as $t
              | if (($t.scopes // []) | index("write")) == null then false
                elif (($t.namespaces // []) | index(.[1].namespace)) == null then false
                else true
                end
            end
          reason: |
            if (.[1].token | length) == 0 then "missing_token"
            elif (.[2].value == null) then "invalid_token"
            else
              (.[2].value | fromjson) as $t
              | if (($t.scopes // []) | index("write")) == null then "missing_scope"
                elif (($t.namespaces // []) | index(.[1].namespace)) == null then "forbidden_namespace"
                else null
                end
            end
      - name: auth_guard
        type: guard
        options:
          condition: .[3].ok
          response:
            status: 401
            contentType: application/json
            body:
              error: .[3].reason
      - name: generate_uuid
        type: transform
        options:
          uuid: now | tostring | gsub("[^0-9]";"") + "-upload"
      - name: build_response
        type: transform
        options:
          status: 202
          headers:
            Location: '"/v2/" + .[1].namespace + "/" + .[1].name + "/blobs/uploads/" + .[5].uuid'
            Content-Length: "0"

  # Put Blob - PUT /v2/{namespace}/{name}/blobs/uploads/{uuid}
  - name: gateway_put_blob
    trigger:
      connector: gateway_http
      options:
        method: PUT
        path: /v2/{namespace}/{name}/blobs/uploads/{uuid}
        content_type: application/octet-stream
    phases:
      - name: extract_params
        type: transform
        options:
          token: .[0].http.headers.authorization // "" | sub("^[Bb]earer\\s+"; "")
          namespace: .[0].http.path_params.namespace
          name: .[0].http.path_params.name
          uuid: .[0].http.path_params.uuid
          digest: .[0].query.digest
          bytes_b64: .[0].http.body_b64
      - name: check_token
        type: redis
        options:
          connector: auth_store
          command: GET
          arguments:
            - '"token:" + .[1].token'
      - name: validate_auth
        type: transform
        options:
          ok: |
            if (.[1].token | length) == 0 then false
            elif (.[2].value == null) then false
            else
              (.[2].value | fromjson) as $t
              | if (($t.scopes // []) | index("write")) == null then false
                elif (($t.namespaces // []) | index(.[1].namespace)) == null then false
                else true
                end
            end
          reason: |
            if (.[1].token | length) == 0 then "missing_token"
            elif (.[2].value == null) then "invalid_token"
            else
              (.[2].value | fromjson) as $t
              | if (($t.scopes // []) | index("write")) == null then "missing_scope"
                elif (($t.namespaces // []) | index(.[1].namespace)) == null then "forbidden_namespace"
                else null
                end
            end
      - name: auth_guard
        type: guard
        options:
          condition: .[3].ok
          response:
            status: 401
            contentType: application/json
            body:
              error: .[3].reason
      - name: validate_digest
        type: transform
        options:
          provided_digest: .[1].digest
          computed_digest: '"sha256:" + (.[1].bytes_b64 | @base64d | sha256)'
          bytes_len: .[1].bytes_b64 | @base64d | length
          digest_ok: .[1].digest == ("sha256:" + (.[1].bytes_b64 | @base64d | sha256))
      - name: digest_guard
        type: guard
        options:
          condition: .[1].digest != null
          response:
            status: 400
            contentType: application/json
            body:
              error: missing_digest
      - name: mismatch_guard
        type: guard
        options:
          condition: .[5].digest_ok
          response:
            status: 400
            contentType: application/json
            body:
              error: digest_mismatch
              computed: .[5].computed_digest
      - name: compute_key
        type: transform
        options:
          key: .[1].namespace + "/" + .[1].name + "/blobs/" + .[1].digest
      - name: store_blob
        type: object_store_put
        options:
          connector: blob_store
          path: .[8].key
          body_b64: .[1].bytes_b64
      - name: record_blob
        type: postgres_exec
        options:
          connector: metadata_db
          sql: |
            INSERT INTO blobs(namespace, name, digest, size)
            VALUES ($1, $2, $3, $4)
            ON CONFLICT (namespace, name, digest)
            DO UPDATE SET size=EXCLUDED.size, updated_at=NOW()
          params:
            - .[1].namespace
            - .[1].name
            - .[1].digest
            - .[5].bytes_len
      - name: build_response
        type: transform
        options:
          status: 201
          contentType: application/json
          headers:
            Docker-Content-Digest: .[1].digest
          body:
            ok: true
            digest: .[1].digest
            size: .[5].bytes_len
