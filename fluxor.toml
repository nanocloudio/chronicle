# chronicle-unified project configuration consumed by the `fluxor` CLI.
# See ~/Development/nanocloudio/standards/{ci,tests,fluxor-modules,dependencies}.md.

[project]
name    = "chronicle"
version = "0.0.1"

# fluxor provides the module SDK source (abi.rs, runtime.rs, params.rs, the PIC
# linker script) materialised by `fluxor sync` into
# target/fluxor/fluxor-abi/sdk/, plus the `fluxor-linux` runtime binary.
[dependencies]
fluxor = "0.0.1"
# These pins serve the conformance graphs in `examples/`, each of which composes
# one provider through a contract and checks that chronicle's side holds.
# Chronicle's engines depend on none of them; an application that composes the
# engines is its own fluxor project and pins what it composes.
#
# wave owns the protocol modules. `examples/grpc_h2/`, `examples/http_exchange/`
# and `examples/exchange_carry/` compose `http` in client and server mode;
# `examples/smtp_sink/` composes `smtp`.
wave = "0.0.1"
# MQTT/Kafka/AMQP messaging is Quantum's domain. `examples/pipeline_egress/`
# composes quantum's `mqtt_sink`, an ordered-ack provider, so the pipeline
# publishes through the contract and names no protocol.
quantum = "0.0.1"
# clustor is the consensus/WAL substrate. `examples/aggregation/` checkpoints
# window state through its `consensus` and `durability` modules.
clustor = "0.0.1"

[ci]
# Module targets `fluxor modules build --all` will produce artefacts for.
# Every engine but `chronicle_cli` builds for all three: the CLI is a host
# authoring tool whose state is ~390 KiB, which no MCU arena holds.
#
# The RP shelves are not optional. Chronicle ships modules for them, so CI has to
# build them or the per-target figures in docs/architecture/resource_summary.md go
# stale without anyone noticing — and those figures are what compose-time admission
# charges a graph against.
targets = ["bcm2712", "rp2350", "rp2040"]

# Every ceiling-shaped const in a file the limit register names is registered,
# so an unregistered one is a defect rather than a backlog item. The register
# says as much in its own admission rule; this makes the build say it too.
#
# The gate is `fluxor ci`'s `limit-register` phase, which every project carrying
# a register is subject to. It checks three things: that each registered constant
# still has its recorded right-hand side, that each recorded coupling is still a
# live `assert!` condition, and that no ceiling-shaped const in a register-named
# file is unregistered.
limit_register_coverage = "fail"

# No [ci.cargo]: this project has no cargo crate. Every unit test lives in the
# host harness under `tests/harness/`, which `fluxor ci`'s `cargo-test (harness)`
# phase runs — so a crate-less project cannot summarise GREEN having run no unit
# tests at all (standards/make.md §5 — the loam trap).

[ci.test]
# The graph E2E gate: each script builds an example graph bundle and drives the
# built .fmod artefacts through the fluxor-linux runtime, asserting real output:
# exact frames for the on-device engines, and for the network compositions what
# a live counterparty received — an SMTP sink, an MQTT broker or an HTTP echo
# (local Python support processes, no containers), or an h2c server graph. This
# is the layer host tests cannot cover — it catches a stale/blank artefact in
# target/, a param-schema drift between compiler and module, and broken example
# configs, each of which otherwise surfaces as a runtime mystery. `fluxor ci`
# runs these after the strict module build.
scripts = [
  # Structural gates: what the tree must BE, checkable without running anything.
  # Module harness tests are NOT here; `fluxor ci` runs those itself.
  "tools/ci/shipping-surface.sh",
  "tools/ci/unsafe-seam.sh",
  "tools/ci/secret-safety.sh",
  "tools/ci/accounting-order.sh",
  "tools/ci/core-coverage.sh",
  "tools/ci/resource-summary.sh",
  "tools/ci/hop-count.sh",
  # Behavioural drivers: each builds a graph bundle and drives the real .fmod
  # artefacts through the fluxor-linux runtime, asserting real output.
  "tools/e2e/*.sh",
]

[ci.hygiene]
# `modules/**` are no_std PIC objects that cannot host a test harness, so inline
# tests there are a real error. Tests belong in `tests/harness/`, a std
# workspace that mounts the same cores. The rule is unconditional: there is no
# host crate in this project for an inline test to belong to.
forbid_inline_tests = ["modules"]
mode                = "strict"

# The engines relax `dead_code` / `unused_imports` / `unreachable_patterns`
# at the crate root, which `lints.md` §3 otherwise forbids in favour of a
# call-site `#[expect]`. Declared here with the reason rather than suppressed,
# on the same grounds fluxor's own `modules/` prefix carries: a PIC module
# `include!`s the whole of `target/fluxor/fluxor-abi/sdk/*` AND the shared
# device cores in `modules/common/*`, so every engine's compile sees the entire
# ABI surface and every core while using a subset of each. That is a property
# of how a PIC module is assembled, not of any one engine, and a call-site
# attribute cannot state it — the unused items are in textually mounted files
# the engine does not own.
[[ci.hygiene.allow_crate_root]]
prefix = "modules/app/"
reason = """Chronicle's engines mount the fluxor SDK and the shared cores in \
modules/common/* via include!, so each engine's compile sees the whole ABI \
surface and every core while consuming a subset. Same cause as fluxor's own \
modules/ prefix; the unused items belong to mounted files, not to the engine, \
so there is no call site to put an #[expect] on."""

# Manifest roots for the telemetry id-table (names, histogram bounds,
# dimension domains): chronicle graphs COMPOSE store-resolved modules from
# these sibling checkouts, and both the build's digest/bounds injection and
# `fluxor id-table` resolve against the SAME list, so the digest handshake
# holds with name-complete rows.
[observability]
id_table_dirs = [
  "../fluxor/modules",
  "../wave/modules",
  "../clustor/modules",
  "../quantum/modules",
]
