# AN HTTP CLIENT AS AN EXCHANGE PROVIDER — a request in, a response back.
#
# The mirror of `examples/pipeline_egress/`. There a requester asked a
# destination that only accepts records (`stream.ordered_ack.sink`); here the
# same requester, the same records and the same ports ask one that ANSWERS
# (`stream.ordered_ack.exchange`). Nothing about the requester changes — which
# is the claim the exchange contract makes, tested rather than asserted.
#
# The pipeline runs no stages: it carries each record to the client as a
# request and each answer back as a record. The parts of the exchange that are
# not its body are data fields, named by the field map:
#
#   request record   {2: method, 3: target, 4: body}
#   answer record    {5: body, 253: status, 6: status, 7: content type}
#
# Field 253 is the exchange status every answer record carries; `status_field`
# and `content_type_field` place the response's own parts where a stage after
# this one would read them.
#
#   python3 tools/support/http_echo.py /tmp/req.txt   # prints its port
#   fluxor run examples/http_exchange/linux.yaml < request.bin
target: linux
tick_us: 100
scheduler:
  accept_cycles: true

platform:
  cli: {}
  net: {}

modules:
  - name: pipeline
    params:
      method_field: 2
      target_field: 3
      status_field: 6
      content_type_field: 7
      # The request body: field 4's bytes.
      encode: "01000204000000616a"
      # The answer body whole, as field 5.
      reply_decode: "78400500000041"
  - name: http
    # The client's provider ports live in its `exchange` variant.
    variant: exchange
    params:
      mode: 1              # client
      protocol: 0          # HTTP/1.1
      authority: "127.0.0.1:18080"

wiring:
  - from: cli_in.stdin_out
    to: pipeline.record_in
  - from: pipeline.request_out
    to: http.request_in
  - from: http.response_out
    to: pipeline.response_in
  - from: pipeline.result_out
    to: cli_out.bytes_in
  - from: http.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: http.net_in
