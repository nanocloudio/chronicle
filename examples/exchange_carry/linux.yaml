# THE CARRY ACROSS AN EXCHANGE — a request's context stays beside the open
# exchange and comes back on the answer record, so the stage handling the answer
# has what the stage that asked had, and nothing outside the record holds it.
#
#   cli_in ─▶ pipeline ─request_out─▶ http (client) ─▶ origin
#                ▲ response_in ◀─response_out─┘
#                └─ result_out ─▶ cli_out
#
# The record names its method (2) and target (3) as data fields, mapped by
# `method_field` / `target_field`; `encode` writes only the body, field 4. Its
# context rides in field 254 (a nested message, as a frame), which the requester
# keeps per exchange and restores on the answer record beside the decoded body
# (5) and the exchange status (253). `tools/e2e/exchange-carry.sh` drives it.
target: linux
tick_us: 100

scheduler:
  accept_cycles: true

platform:
  cli: {}
  net: {}

modules:
  - name: pipeline
    params:
      # Rec{method, path, body, ctx} copied whole — `ctx: r.ctx` is the carry.
      ir_stages: "01ff3100050001020000001202000000050001030000001203000000050001040000001204000000050001fe00000012fe00000013"
      method_field: 2
      target_field: 3
      # The request body: field 4's bytes.
      encode: "01000204000000616a"
      # The answer body whole, as field 5.
      reply_decode: "78400500000041"
  - name: http
    # The client's provider ports live in its `exchange` variant.
    variant: exchange
    params:
      mode: 1              # client
      protocol: 0          # HTTP/1.1
      authority: "127.0.0.1:18080"

wiring:
  - from: cli_in.stdin_out
    to: pipeline.record_in
  - from: pipeline.request_out
    to: http.request_in
  - from: http.response_out
    to: pipeline.response_in
  - from: pipeline.result_out
    to: cli_out.bytes_in
  - from: http.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: http.net_in
