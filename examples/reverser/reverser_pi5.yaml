# THE WHOLE REVERSER ON ONE BOARD — bare-metal Pi 5, one graph, port 80.
#
#   browser ─HTTP:80─▶ wave http ──▶ intake → store ⇄ pg_client ──┐ 127.0.0.1
#                          ▲          (both routes)                 │  :5432
#                          └─────────── reply ◀── store             │
#                                                                   ▼
#     lattice: pg_edge_anchor → executor → router → consensus → WAL/NVMe
#                                             │ committed puts (table 1)
#                                             ▼
#                     cdc_pump ──request──▶ B: dec_evt → keep_puts → flip
#                              ◀── 200 ────    → enc_sql ⇄ pg_client ──┘
#
# The SAME application as run.sh's distributed shape — the same uproc, the
# same codec programs where the wire is the same — with three deployment
# substitutions and zero logic changes:
#   - one `http` serves both routes, so A and C share one intake → store →
#     reply chain, routed by `admit_either` and answered by `respond`,
#   - the MQTT broker leg becomes pipeline B itself: dec_evt is the pump's
#     ordered-ack sink (`request_in` with `ack`), so every CDC event is
#     acknowledged by the pipeline that consumed it, and the pump's
#     in-flight window is the backpressure between store and app, and
#   - the pg_client connections ride the ip module's LOCAL-DELIVERY
#     fastpath (fluxor ip: a connect to 127.0.0.1 binds a conn pair
#     against the local listener — no TCP, no ARP), which is what makes a
#     client module composable against its own board's listener.
#
# Storage half assembled from the PROVEN pi5 configs (relational front from
# bare-metal-pi5-relational.yaml, state_store worker + deadlines from
# bare-metal-pi5-disk.yaml, allocator/pump from the linux tier). Modules
# resolve from the store by CHRONICLE's pins (lattice + clustor + wave).
target: pi5
# 2000, not the bench rigs' 1000: per-request latency is roughly pipeline
# depth x tick_us, and this graph is the application path AND its storage
# tier on one core. The storage tier does not need a larger tick — every
# store action whose natural size is the table's, not the command's (flush,
# compaction, the CDC version scan, a paged SQL read) runs as one bounded
# slice per step — so the tick is sized for the request path alone. What
# remains above it is the device's tail (a FAT32/NVMe cache flush stalls a
# synchronous FS call 35-150 ms), declared below as `tolerate`: recorded,
# never fatal.
tick_us: 2000

scheduler:
  accept_cycles: true

platform:
  net: {}
  debug:
    to: net
    monitor: true
    # Telemetry export (phase-1 silicon acceptance): fxtl-compact batches to
    # fluxor-collect on the workstation (host.toml collector_ip), which
    # resolves names/bounds/dims from `fluxor id-table` over the SAME roots
    # the build injected (fluxor.toml [observability] id_table_dirs) and
    # serves Prometheus text on :9464.
    export_telemetry: udp
    export_dst_port: 4317

modules:
  # ── Bare-metal storage stack (the FS contract WAL + LSM use) ────
  - name: nvme
    bind: m2_primary
    namespace: 1
    queue_depth: 32
  - name: fat32
    path: /
    # The store is PERSISTENT across boots: the WAL replays and the LSM
    # manifest is recovered, so a reboot serves what the last boot committed
    # and the catalog keeps its table ids (the pump's keyrange depends on
    # `inbound` being table 1 — see lattice_reverser.yaml — which the first
    # CREATE on a fresh volume establishes and every later boot preserves).
    # Nothing here names or wipes a volume; the example runs on any Pi 5 with
    # an NVMe FAT32 volume.
    #
    # A first durable write on a cold volume forces a segment create — a
    # one-shot tens-of-ms synchronous FS operation. That is a legitimate
    # device tail, not a budget this module asks to hold every step, so it
    # is declared as one: `tolerate` records the overrun and keeps the
    # module running. A step deadline sized to it would ask the domain to
    # reserve a budget it can never honour at a 2 ms tick — the deadline is a
    # detection threshold, not a reservation.
    fault_policy: tolerate
    init_free_hint: 20000

  # ── Relational front ────────────────────────────────────────────
  - name: pg_edge_anchor
    params:
      listen_port: 5432
  - name: relational_executor

  # ── Lattice KV core ─────────────────────────────────────────────
  - name: kv_request_router
    params:
      replicated: 1
  - name: kv_state_worker
    params:
      # Ordered disk state-store; 8.3 names at the FAT32 root (no mkdir in
      # the bare-metal FS contract).
      state_store: 1
      root_path: 1
    # The worker's own work is bounded per step by construction: flush and
    # compaction run 32 records per step, the CDC version scan two run
    # blocks per step (the page is held between slices), paged SQL reads
    # resume from a position memo, point reads seek through the run index,
    # and a run block is one FS call. 8 ms is the detection threshold for a
    # step that carries several run-backed lookups on this FAT32/NVMe stack
    # (~0.2 ms per block); a step past it is a device tail — a cache flush
    # stalling a synchronous FS call for 35-150 ms — which `tolerate`
    # records and survives. The burst deadline is pinned at the validator's
    # 16 x tick_us ceiling so the default x8 does not exceed it.
    step_deadline_us: 8000
    step_deadline_burst_us: 32000
    fault_policy: tolerate
  - name: lattice_apply_bridge

  # ── MVCC timestamp authority (commit_ts IS the reverser's sequence) ─
  - name: timestamp_allocator
    params:
      allocator_id: 1
      auto_grant_to: 1
      auto_grant_interval_steps: 100
      propose_wrap: 1

  # ── Clustor client-proposal pipeline ────────────────────────────
  - name: peer_router
    params:
      self_id: 0
      peer_count: 1
      listen_port: 9090
      peer0: "127.0.0.1:9090"
  - name: gateway
    params:
      self_id: 0
  - name: admission
  - name: control_plane
  - name: consensus
    params:
      self_id: 0
      voter_count: 1
      heartbeat_interval_ms: 150
  - name: durability
    # Async durable-write path (FS_WRITE_ASYNC + submit/poll fences): the
    # step never blocks on an fsync, and its cold one-shots (segment create,
    # boot replay) return Burst and are covered by the burst deadline. What
    # can still exceed the default 2 ms detection threshold is the device
    # tail behind a synchronous FS call, which no deadline can budget for;
    # it is recorded and the module keeps running.
    fault_policy: tolerate
    params:
      fsync_mode: 1
      group_window_ms: 0
      group_max_pending: 8
      fence_depth: 8
      # FAT32 root, 8.3 segment names. The WAL replays at boot: the store
      # is persistent, and a replayed tail is what keeps the recovered run
      # set, the memtable and the timestamp clock consistent with each
      # other.
      root_path: 1
      segment_bytes: 4194304
      self_id: 0
      voter_count: 1
      partition_id: 0

  # ── CDC egress: pump + quantum's MQTT QoS-1 producer ────────────
  - name: cdc_pump
    params:
      feed_id: 1
      table_id: 1
      # [KS_RELATIONAL_TABLE = 0x80000002][table_id = 1], hex.
      prefix: "8000000200000001"
      proto: 1              # PROTO_ETCD — matches the wired pair
      # 5000, not the linux tier's 500: every checkpoint is a KV put, and on
      # this FAT32/NVMe stack the puts are what drive the memtable flush
      # cadence (see tick_us above). A demo feed does not need 500 ms
      # checkpoint granularity; it needs the graph alive tomorrow.
      checkpoint_interval_ms: 5000
      resolved_interval_ms: 5000
      claim_interval_ms: 5000
      retention_budget_ms: 60000
      # A PATIENT pump. A scan page over a large table is answered across
      # many steps (the worker walks two run blocks per step and holds the
      # page between slices), and under an insert burst its slices share
      # the tick with the SQL commands. A 2 s grace would report the feed
      # stalled while a page is simply still paging; 15 s is longer than
      # any page's walk at this tick. page_limit stays at the default 16.
      stall_grace_ms: 15000


  # ═══ THE APPLICATION — wave http + the chronicle pipelines ═══
  # Containers compiled from reverser.uproc; codecs annotated in the linux
  # graphs (reverser_a/b/c.yaml) — identical bytes where the wire is
  # identical. The one new codec is dec_evt's: it reads the pump's request
  # BODY (the cdc_wire envelope) instead of MQTT subscriber frames.
  - name: http
    # The `app` variant: h1 + the application routes and nothing else
    # (−84 KB vs full). The netboot path has an empirical ~3.6 MB image
    # ceiling — images crossing it boot silent-dead with the payload
    # unreadable — and this image lives just under it. See also the
    # observability trim below.
    variant: app
    port: 80
    routes:
      # EXACT static routes first: a browser fires /favicon.ico (and bare /)
      # on the SAME keep-alive connection as the app requests. Exact matches
      # dispatch before the catch-all, so the noise answers instantly and
      # never reaches the pipelines.
      - path: "/favicon.ico"
        content_type: "image/x-icon"
        body: " "
      - path: "/"
        content_type: "text/html"
        body: "<html><body><h1>reverser</h1><p><a href=\"/messages?max=10\">/messages?max=10</a> — newest reversed messages</p><p>/reverse?msg=hello — insert</p></body></html>"
      # The application catch-all: the target (query included) arrives
      # verbatim, and `admit_either` routes it or answers 404.
      - path: "/"
        app: true

  # ── A + C: GET /reverse?msg=… → INSERT; GET /messages?max=… → SELECT ──
  - name: intake
    type: pipeline
    params:
      id_field: 1
      target_field: 3
      status_field: 4
      ir_stages: ""
      stage_kinds: "01"
  - name: store
    type: pipeline
    params:
      method: 3            # POST: a query, the SQL in the body
      # The body: the SQL text the intake built, field 2.
      encode: "01000202000000616a"
      # The answer body whole — the rows — as field 2.
      reply_decode: "78400200000041"
  - name: pg_ac
    type: pg_client
    params:
      authority: "127.0.0.1:5432" # the ip loopback fastpath
      user: "lattice"
      database: "lattice"
  - name: reply
    type: pipeline
    params:
      id_field: 1
      status_field: 4
      content_type_field: 5
      answer: 1
      ir_stages: ""
      stage_kinds: "01"
      # The body: field 2.
      encode: "01000202000000616a"

  # ── B: CDC put → keep_puts → reverse() → INSERT INTO reversed ───
  - name: dec_evt
    type: pipeline
    params:
      ir_stages: "01ff250005000101000000120100000005000102000000120200000005000103000000120300000013"
      # The cdc_wire envelope: [01 00][kind:u8] → f3, 13 bytes skipped,
      # [len:u16][key] → f2, [commit_ts:u64] → f1. Every kind decodes
      # cleanly; keep_puts filters.
      decode: "71020001007501014003000000700d00750201744002000000750801400100000041"
      # Answer each event 200 once its record is accepted downstream.
      ack: 1
  - name: keep_puts
    type: decision
    params:
      decision: "0105000000120001000203000000100100000000000000200012000000390001000201000000400100000001000202000000100900000000000000010002020000005301001002000000000000005153090040020000004101000000010041"
  - name: flip
    type: pipeline
    params:
      ir_stages: "01ff1c0005000101000000120100000005000102000000150b00120200000013"
  - name: enc_sql_b
    type: pipeline
    params:
      ir_stages: "01ff190005000101000000120100000005000102000000120200000013"
      method: 3            # POST: a query, the SQL in the body
      encode: "602700494e5345525420494e544f207265766572736564202874732c206d7367292056414c554553202801000201000000616003002c2027010002020000006160020027296a"
  - name: pg_b
    type: pg_client
    params:
      authority: "127.0.0.1:5432"
      user: "lattice"
      database: "lattice"

  # (Observability fan-in trimmed: the netboot image ceiling is ~3.6 MB
  # and operations/adapter_metrics/compaction_coordinator bought the room.
  # UDP telemetry — debug.to: net — still carries every module heartbeat.)

wiring:
  # ── nvme block device ↔ fat32 filesystem ────────────────────────
  - from: nvme.blocks
    to: fat32.blocks

  # ── Edge ↔ ip (bare-metal TCP) ──────────────────────────────────
  - from: ip.net_out
    to: pg_edge_anchor.net_in
  - from: pg_edge_anchor.net_out
    to: ip.net_in

  # ── Connector ↔ executor ────────────────────────────────────────
  - from: pg_edge_anchor.sql_out
    to: relational_executor.pg_in
  - from: relational_executor.pg_out
    to: pg_edge_anchor.sql_in

  # ── Executor ↔ router (PROTO_INTERNAL_SQL pair) ─────────────────
  - from: relational_executor.kv_out
    to: kv_request_router.internal_sql_in
  - from: kv_request_router.compute_out
    to: relational_executor.kv_in

  # ── Proposal ingress: router → gateway → consensus ─────────────
  - from: kv_request_router.proposal_out
    to: gateway.client_requests
  - from: gateway.responses
    to: kv_request_router.gateway_reject
  - from: gateway.proposals_tagged
    to: consensus.proposals_tagged
  - from: consensus.proposal_assigned
    to: gateway.proposal_assigned
  - from: consensus.leader_state
    to: gateway.leader_state
  - from: admission.credits
    to: gateway.credit_supply
  - from: control_plane.routing
    to: gateway.placement

  # ── Apply path: committed entries → KV worker → response ───────
  - from: consensus.committed_entries
    to: lattice_apply_bridge.committed_in
  - from: lattice_apply_bridge.records_out
    to: timestamp_allocator.committed_state
  - from: timestamp_allocator.propose_out
    to: gateway.client_requests
  - from: kv_state_worker.lease_request
    to: timestamp_allocator.lease_request
  - from: lattice_apply_bridge.kv_out
    to: kv_state_worker.commands
  - from: kv_request_router.kv_out
    to: kv_state_worker.commands
  - from: kv_state_worker.responses
    to: kv_request_router.kv_in

  # ── Clustor persistence (WAL → fat32 → nvme via FS contract) ────
  - from: consensus.log_append
    to: durability.entries
    rate: transaction
  - from: consensus.entry_request
    to: durability.entry_request
    buffer_bytes: 8192
  - from: durability.entry_reply
    to: consensus.entry_reply
    buffer_bytes: 8192
  - from: durability.replay_complete
    to: consensus.wal_replay_complete
    rate: transaction
  - from: durability.flushed
    to: consensus.wal_flushed
  - from: durability.installed_local
    to: consensus.snapshot_installed
  - from: consensus.log_maintenance
    to: durability.compact_before
  - from: durability.quorum_durable
    to: consensus.durable
  # App state-machine snapshot bodies (required with state_store: 1).
  - from: durability.app_snapshot_ctl
    to: kv_state_worker.snapshot_import
    rate: transaction
  - from: kv_state_worker.snapshot_export
    to: durability.app_snapshot_body
    rate: transaction

  # ── CDC wiring: pump ⇄ router (etcd pair), pump ⇄ sink ─────────
  - from: cdc_pump.kv_out
    to: kv_request_router.etcd_in
  - from: kv_request_router.etcd_out
    to: cdc_pump.kv_in
  # Pipeline B is the pump's ordered-ack sink: it answers each event once the
  # record it produced is accepted downstream, and the pump's in-flight
  # window bounds how far the store can run ahead of the app.
  - from: cdc_pump.request_out
    to: dec_evt.request_in
  - from: dec_evt.response_out
    to: cdc_pump.response_in

  # ── Observability fan-in → operations → HTTP /metrics ───────────

  # ═══ Application wiring ═══
  - from: ip.net_out
    to: http.net_in
  - from: http.net_out
    to: ip.net_in

  # A + C
  - from: http.request_out
    to: intake.request_in
  - from: intake.result_out
    to: store.record_in
  - from: store.request_out
    to: pg_ac.request_in
  - from: pg_ac.response_out
    to: store.response_in
  - from: store.result_out
    to: reply.record_in
  # The intake's grants and refusals reach `http` through `reply`, whose
  # `response_out` is the one producer `http.response_in` takes.
  - from: intake.response_out
    to: reply.response_in
  - from: reply.response_out
    to: http.response_in
  - from: pg_ac.net_out
    to: ip.net_in
  - from: ip.net_out
    to: pg_ac.net_in

  # B (dec_evt.request_in is fed by the pump above)
  - from: dec_evt.result_out
    to: keep_puts.record_in
  - from: keep_puts.result_out
    to: flip.record_in
  - from: flip.result_out
    to: enc_sql_b.record_in
  - from: enc_sql_b.request_out
    to: pg_b.request_in
  - from: pg_b.response_out
    to: enc_sql_b.response_in
  - from: pg_b.net_out
    to: ip.net_in
  - from: ip.net_out
    to: pg_b.net_in
