# REVERSER pipeline A — ingest: GET /reverse?msg=… becomes a relational row.
#
#   client ─HTTP→ http (wave)             terminates HTTP; each request an exchange
#            │ request_out
#            ↓
#          intake     pipeline            provider: id + target as fields;
#            ↓                            `admit_reverse` builds the INSERT
#            │                            from "/reverse?msg=" or answers 404
#          store      pipeline            requester: the SQL as the body
#            ⇅ request_out / response_in
#          pg_client  (lattice)           SCRAM + simple query; answers 200
#            ↓                            once the INSERT committed
#          reply      pipeline            `respond`: 200 "ok", or the
#            │ response_out               store's own status; carries the
#            ↓                            intake's grants and refusals too
#          http ─HTTP→ client
#
# ONE straight line: the row lands via consensus in lattice, and the "ok"
# answers only after the store confirmed the INSERT — the answer is the
# completion signal, not an optimistic guess. The HTTP exchange's id rides the
# store hop in the record's carry (field 254), so nothing holds a table of who
# asked. What happens NEXT (CDC → the reversing pipeline B) is asynchronous by
# design.
#
# Every `ir_stages` value is compiled from `reverser.uproc`; a decision runs as
# an inline stage (`stage_kinds: "01"`), its container from:
#   H=$(python3 -c 'print(open("examples/reverser/reverser.uproc","rb").read().hex())')
#   fluxor exec chronicle -- graph "$H" <entry> linux
# The `encode` programs write only bodies — the SQL text and the answer — and
# are hand-authored; see README.md.
target: linux
tick_us: 100

# http↔linux_net and http↔engines are request/response pairs — cycles.
scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  # ── wave: the HTTP server ────────────────────────────────────────────────
  - name: http
    port: ${REV_A_PORT:-15100}
    # 1 = downstream is `linux_net`: the kernel owns TCP segmentation.
    host_tcp: 1
    routes:
      # A bare "/" IS the application catch-all: the target — query string
      # included — arrives verbatim and `admit_reverse` decides.
      - path: "/"
        app: true

  # ── request path ─────────────────────────────────────────────────────────
  - name: intake
    type: pipeline
    params:
      id_field: 1
      target_field: 3
      status_field: 4
      ir_stages: ""
      stage_kinds: "01"

  - name: store
    type: pipeline
    params:
      method: 3            # POST: a query, the SQL in the body
      # The body: the SQL text the intake built, field 2.
      encode: "01000202000000616a"

  # ── lattice: the SQL connector ───────────────────────────────────────────
  # Pinned from the store, not vendored. SCRAM-SHA-256 is why storage access
  # is a compiled module and not bytecode.
  - name: pg_client
    params:
      authority: "127.0.0.1:${REV_PG_PORT:-15432}"
      user: "lattice"
      database: "lattice"

  # ── answer path ──────────────────────────────────────────────────────────
  - name: reply
    type: pipeline
    params:
      id_field: 1
      status_field: 4
      content_type_field: 5
      answer: 1
      ir_stages: ""
      stage_kinds: "01"
      # The body: field 2.
      encode: "01000202000000616a"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  - from: http.request_out
    to: intake.request_in
  - from: intake.result_out
    to: store.record_in
  - from: store.request_out
    to: pg_client.request_in
  - from: pg_client.response_out
    to: store.response_in
  - from: store.result_out
    to: reply.record_in
  # The intake's grants and refusals reach `http` through `reply`, whose
  # `response_out` is the one producer `http.response_in` takes.
  - from: intake.response_out
    to: reply.response_in
  - from: reply.response_out
    to: http.response_in

  - from: pg_client.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: pg_client.net_in
