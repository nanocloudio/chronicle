# REVERSER pipeline C — query: GET /messages?max=N lists the newest reversed
# messages as HTML.
#
#   client ─HTTP→ http (wave)
#            │ request_out
#            ↓
#          intake     pipeline     provider: id + target as fields;
#            ↓                     `admit_messages` builds SELECT … LIMIT N
#            │                     from "/messages?max=" or answers 404
#          store      pipeline     requester: the SQL as the body
#            ⇅
#          pg_client  (lattice)    answers 200 with the first column of every
#            ↓                     row, \n-joined; `reply_decode` makes it field 2
#          reply      pipeline     `respond`: 200 text/html, the rows wrapped in
#            │ response_out        <html><body><pre>…</pre></body></html>
#            ↓
#          http ─HTTP→ client
#
# ORDER BY ts DESC over reversed(ts BIGINT PRIMARY KEY) is replay order over
# the store-minted commit timestamps — "the last up-to-max messages" without
# any client-side sequence. A result set that would overflow pg_client's
# answer bound is REFUSED whole (502, never truncated), and that status is
# what the client sees, never a prefix shown as if it were everything.
target: linux
tick_us: 100

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: http
    port: ${REV_C_PORT:-15102}
    host_tcp: 1
    routes:
      - path: "/"
        app: true

  - name: intake
    type: pipeline
    params:
      id_field: 1
      target_field: 3
      status_field: 4
      ir_stages: ""
      stage_kinds: "01"

  - name: store
    type: pipeline
    params:
      method: 3            # POST: a query, the SQL in the body
      # The body: the SQL text the intake built, field 2.
      encode: "01000202000000616a"
      # The answer body whole — the rows — as field 2.
      reply_decode: "78400200000041"

  - name: pg_client
    params:
      authority: "127.0.0.1:${REV_PG_PORT:-15432}"
      user: "lattice"
      database: "lattice"

  - name: reply
    type: pipeline
    params:
      id_field: 1
      status_field: 4
      content_type_field: 5
      answer: 1
      ir_stages: ""
      stage_kinds: "01"
      # The body: field 2.
      encode: "01000202000000616a"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  - from: http.request_out
    to: intake.request_in
  - from: intake.result_out
    to: store.record_in
  - from: store.request_out
    to: pg_client.request_in
  - from: pg_client.response_out
    to: store.response_in
  - from: store.result_out
    to: reply.record_in
  - from: intake.response_out
    to: reply.response_in
  - from: reply.response_out
    to: http.response_in

  - from: pg_client.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: pg_client.net_in
