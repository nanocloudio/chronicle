# HTTP LOAD BENCHMARK — TWO NODES, one hop
#
# Three graphs differ ONLY in how many chronicle nodes a request crosses.
# Everything else — conn_guard, tls, the http server, the response bytes — is
# held identical to wave's `examples/rig/pi5_https.yaml`, whose numbers this
# sits beside:
#
#   baseline   http answers from a static route      0 engine nodes
#   one_node   http -> pipeline -> http              1 node, 0 hops
#   two_node   http -> pipeline -> pipeline -> http  2 nodes, 1 HOP
#
# (one_node - baseline) prices a pipeline on the request path.
# (two_node - one_node) prices ONE channel hop: a channel write, a channel
# read and a scheduler dispatch. The host microbenchmark sees neither — it
# runs stages with no scheduler and no channels.
#
# The TLS chain is wired EXPLICITLY. `platform: net:` injects the board's net
# stack (rp1_gem, conn_guard, ip) and stops there; it does not connect tls or
# http. A graph that omits these edges boots clean, reports healthy telemetry,
# and refuses every connection because nothing ever bound.
target: pi5
tick_us: 50

platform:
  net: {}
  debug:
    to: net
    monitor: true

modules:
  - name: conn_guard
    rate_limit_per_ip: 200
    rate_window_ms: 100
  - name: tls
    mode: 1
    verify_peer: 0
    cert_file: "/tmp/server_cert.der"
    key_file:  "/tmp/server_key.der"
    ecdh_bits_per_step: 32
  - name: http
    port: 443
    routes:
      - path: "/"
        app: true
  # The same work split across two nodes: `first` decodes and passes through,
  # `second` transforms and encodes.
  - name: first
    type: pipeline
    params:
      decode: "75020140010000007502014002000000750101400300000070010075020170040074400400000041"
      ir_stages: "01ff310005000101000000120100000005000102000000120200000005000103000000120300000005000104000000120400000013"
  - name: second
    type: pipeline
    params:
      ir_stages: "01ff270005000101000000120100000005000102000000120200000001c800000000000000120300000013"
      encode: ""

wiring:
  # The transport chain, exactly as wave's rig graph wires it.
  - from: ip.net_out
    to: tls.cipher_in
  - from: tls.cipher_out
    to: ip.net_in
    buffer_bytes: 131072
  - from: tls.clear_out
    to: http.net_in
  - from: http.net_out
    to: tls.clear_in
    buffer_bytes: 32768
  - from: http.req_out
    to: first.record_in
    buffer_group: 1
  - from: first.result_out
    to: second.record_in
  - from: second.result_out
    to: http.resp_in
    buffer_group: 2
