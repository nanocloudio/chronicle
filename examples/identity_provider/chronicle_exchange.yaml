# The identity provider: POST /oauth/token (the OIDC authorization-code
# EXCHANGE), chronicle over kagi.
#
# The third leg of the reference IdP, after introspect (chronicle_idp.yaml) and
# the device-grant token (chronicle_token.yaml). This routes to kagi's
# `authcode` module, which redeems a single-use authorization code + its PKCE
# verifier for an access token and an ID token — both minted INSIDE kagi over
# the subject the code carries. The pipeline splits the request body into the
# four fields authcode needs and transports them opaquely; it constructs no
# code, no token, no subject.
#
#   client ─HTTP→ http (wave)             body is
#            │ request_out                 <code>\n<redirect_uri>\n<client_id>\n<verifier>
#            ↓
#          intake     pipeline            provider: id, method and target as
#            ↓                            fields; the body split on '\n' into
#            │                            four; `to_exchange`
#          redeem     pipeline            requester: MSG_CODE_EXCHANGE_REQ as
#            ⇅ request_out / response_in  the body
#          authcode (kagi)                re-checks the code, consumes it once,
#            ↓                            mints access + id tokens — the subject
#            │                            never leaves kagi via the pipeline
#          reply      pipeline            `to_exchange_answer`; carries the
#            │ response_out               intake's own refusals too
#            ↓
#          http ─HTTP→ client
#
# TWO DECISIONS, ONE PER JUNCTION, and the second matches KAGI'S authz
# verdict — the pipeline cannot mint what authcode refused. That is C14 for the
# code exchange.
#
# The authorization code is created by /authorize in a real flow; to exercise
# the exchange leg in isolation the operator SEEDS a code record into the
# ledger over the control carrier (exactly as the token graph seeds a device).
# That is operator state, not pipeline construction — the C14 line is about
# what the PIPELINE builds, and it builds nothing.
#
# `ir_stages` are `idp.uproc` compiled (`serve_exchange` and
# `answer_exchange`; see chronicle_idp.yaml for the command). Run it with
# ./run.sh --exchange. See README.md.
target: linux
# Ten modules: a 100 µs tick is under what one pass of them can take, so the
# tick is kagi's own e2e graphs' 500 µs.
tick_us: 500

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: http
    port: ${IDP_PORT:-15100}
    host_tcp: 1
    routes:
      - path: "/ws"
        websocket_fanout: true
        retain_replay: false
      # The token endpoint. The body is
      # <code>\n<redirect_uri>\n<client_id>\n<code_verifier> — four single-line
      # values a codec splits without parsing. Exact route.
      - path: "/oauth/token"
        app: true

  # ── the request half ─────────────────────────────────────────────────────
  - name: intake
    type: pipeline
    params:
      id_field: 1
      method_field: 2
      target_field: 3
      # rd: UNTIL_OPT '\n' ×3 (code, redirect_uri, client_id), REST →
      # code_verifier. A short body pads with empty values rather than
      # failing, and kagi says what an empty one is worth.
      decode: "7b0a40040000007b0a40050000007b0a400600000078400700000041"
      # idp.uproc's `to_exchange`: POST /oauth/token → ExchangeCall{code,
      # redirect_uri, client_id, code_verifier}; anything else → an empty
      # code, which kagi refuses. The HTTP exchange id rides in `ctx`.
      ir_stages: ""
      stage_kinds: "01"

  - name: redeem
    type: pipeline
    params:
      method: 3            # POST: a typed operation's request
      # ser: MSG_CODE_EXCHANGE_REQ (0x3B) [code f16][redirect_uri f16]
      # [client_id f8][code_verifier f16].
      encode: "6001003b6501000204000000646202010100020400000061010002050000006462020101000205000000610100020600000064620101010002060000006101000207000000646202010100020700000061670201006a"
      # rd: MSG_CODE_EXCHANGE_RESP (0x3C) — skip the envelope; [status u8] →
      # 3, [access_token f16] → 4, [id_token f16] → 5.
      reply_decode: "700300750101400300000075020174400400000075020174400500000041"

  # ── kagi: redeem the code and mint ────────────────────────────────────────
  #
  # authcode holds the device-cert keyset (verify_key), the client registry,
  # the single-use code store and the device ledger (all in security_state),
  # and asks token_mint for BOTH the access token and the ID token. iss/aud/
  # ttl/id_ttl/suite are deployment params — a client asks for none.
  - name: authcode
    iss: "https://issuer.authcode.test"
    aud: "https://rs.authcode.test"
    ttl_seconds: 600
    id_ttl_seconds: 300
    suite: 2   # Ed25519

  - name: token_mint
    params:
      # The key-custody floor this deployment claims. `token_mint` refuses to
      # construct undeclared: where a signing key may live is a deployment
      # decision, and a default would make the weaker choice silently. An
      # example on a dev box claims `development`; a real deployment claims
      # `production` and is held to that floor.
      posture: development

  - name: security_state
    params:
      # One board, one ledger: the single-node authority. A ledger that does
      # not declare its authority refuses every request.
      authority: "single-node"

  # The control carrier (see chronicle_idp.yaml): three channels of
  # `auth_wire` envelopes.
  - name: ws
    type: ws_net
  - name: mux
    type: remote_channel
    channels: "OctetStream:tlv16:4096;OctetStream:tlv16:4096;OctetStream:tlv16:4096"
    require_peer: 0

  # ── the reply half ────────────────────────────────────────────────────────
  - name: reply
    type: pipeline
    params:
      id_field: 1
      status_field: 4
      answer: 1
      content_type: "text/plain"
      # idp.uproc's `to_exchange_answer`: OK → 200 + access token; state
      # unavailable / no key / mint-failed → 503; every other verdict — the
      # presenter refusals and any code the document does not know — → 400.
      ir_stages: ""
      stage_kinds: "01"
      # The body: field 2 — the access token on 200, empty on every refusal.
      encode: "01000202000000616a"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  # The serving chain.
  - from: http.request_out
    to: intake.request_in
  - from: intake.result_out
    to: redeem.record_in
  - from: redeem.request_out
    to: authcode.request_in
  - from: authcode.response_out
    to: redeem.response_in
  - from: redeem.result_out
    to: reply.record_in
  - from: intake.response_out
    to: reply.response_in
  - from: reply.response_out
    to: http.response_in

  # The control carrier.
  - from: ws.tx_out
    to: http.ws_in
    buffer_group: 3
  - from: http.ws_out
    to: ws.rx_in
    buffer_group: 4
  - from: http.ws_event_out
    to: ws.event_in
  - from: ws.net_out
    to: mux.transport_in
  - from: mux.transport_out
    to: ws.net_in

  # ch0: the mint's signing keys in, its announced public halves back. Two
  # keys ride this channel — the ACCESS_TOKEN profile and the ID_TOKEN profile.
  - from: mux.ch0_rx
    to: token_mint.key_material
  - from: token_mint.key_announce
    to: mux.ch0
  # ch1: the device-certificate verify key (authcode's keyset must be non-empty
  # to serve, even though the exchange leg authenticates via the code + PKCE).
  - from: mux.ch1_rx
    to: authcode.verify_key
  # ch2: the operator seeds a device record and a code record; the acks
  # return here.
  - from: mux.ch2_rx
    to: security_state.requests
  - from: security_state.replies
    to: mux.ch2

  # authcode ↔ ledger, and authcode as the requester of the mint's exchange
  # (internal; the tokens never leave kagi via the pipeline, and the subject
  # never enters it).
  - from: authcode.state_requests
    to: security_state.requests
  - from: security_state.replies
    to: authcode.state_replies
  - from: authcode.mint_out
    to: token_mint.request_in
  - from: token_mint.response_out
    to: authcode.mint_in
