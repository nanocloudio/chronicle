# The identity provider: POST /oauth/token, chronicle over kagi.
#
# The companion to chronicle_idp.yaml (introspect). Same shape — chronicle's
# generic engine carries the dispatch, kagi's modules hold every credential
# decision, and `idp.uproc` compiles to the params. The difference is the
# junction: this routes to mint_admission's GRANT operation, which admits a
# device credential and mints an access token, the subject established and
# signed entirely inside kagi. The pipeline transports the opaque credential
# in and the opaque token out; it constructs nothing.
#
#   client ─HTTP→ http (wave)             body is <credential>\n<proof>
#            │ request_out
#            ↓
#          intake     pipeline            provider: id, method and target as
#            ↓                            fields; the body split on '\n' into
#            │                            credential + proof; `to_grant`
#          grant      pipeline            requester: MSG_GRANT_REQ as the body
#            ⇅ request_out / response_in
#          mint_admission (kagi)          ADMITS, then asks token_mint — the
#            ↓                            subject never leaves kagi via the
#            │                            pipeline; answers MSG_GRANT_RESP
#          reply      pipeline            `to_token_answer`; carries the
#            │ response_out               intake's own refusals too
#            ↓
#          http ─HTTP→ client
#
# TWO DECISIONS, ONE PER JUNCTION, and the second matches KAGI'S grant
# verdict — the pipeline cannot mint what admission refused, because the only
# thing it can branch on is what kagi said. That is C14 for /oauth/token.
#
# `ir_stages` are `idp.uproc` compiled (`serve_token` and `answer_token`; see
# chronicle_idp.yaml for the command). Run it with ./run.sh --token. See
# README.md.
target: linux
# Ten modules: a 100 µs tick is under what one pass of them can take, so the
# tick is kagi's own e2e graphs' 500 µs.
tick_us: 500

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: http
    port: ${IDP_PORT:-15100}
    host_tcp: 1
    routes:
      # Operator input: signing key, device-cert verify key, and the device
      # record are delivered over the control carrier, never on the serving
      # path. `retain_replay: false` — a key or record frame must not replay
      # to a fresh subscriber.
      - path: "/ws"
        websocket_fanout: true
        retain_replay: false
      # The token endpoint. The body is <device-certificate>\n<dpop-proof>:
      # two compact JWSs, neither of which contains a newline, so a codec
      # splits them without parsing either. Exact route (no trailing slash).
      - path: "/oauth/token"
        app: true

  # ── the request half ─────────────────────────────────────────────────────
  - name: intake
    type: pipeline
    params:
      id_field: 1
      method_field: 2
      target_field: 3
      # rd: UNTIL_OPT '\n' → credential (4); REST → proof (5). A body with
      # no newline is not refused here: it becomes a credential and an empty
      # proof, and kagi says what that is worth.
      decode: "7b0a400400000078400500000041"
      # idp.uproc's `to_grant`: POST /oauth/token → GrantCall{credential,
      # proof}; anything else → an empty credential, which kagi refuses. The
      # HTTP exchange id rides in `ctx` (field 254).
      ir_stages: "01ff8700010c0000002c00010002020000001003000000000000002001000203000000120c002f6f617574682f746f6b656e53030030000c00000028000100020400000040040000000100020500000040050000000100020100000042010140fe000000410a0000002000120000400400000012000040050000000100020100000042010140fe00000041"
      stage_kinds: "01"

  - name: grant
    type: pipeline
    params:
      method: 3            # POST: a typed operation's request
      # ser: MSG_GRANT_REQ (0x37) [method="POST"][uri="/oauth/token"]
      # [credential f16][proof f16][otp f8] — the method and URI are the ones
      # the DPoP proof is bound to. The OTP is empty: this deployment enrols
      # no second factor, and an absent code is admitted at whatever level
      # the other proofs reach.
      encode: "600100376560050004504f5354600e000c002f6f617574682f746f6b656e010002040000006462020101000204000000610100020500000064620201010002050000006160010000670201006a"
      # rd: MSG_GRANT_RESP (0x38) — skip the envelope; [status u8] → 3,
      # [token f16] → 4.
      reply_decode: "700300750101400300000075020174400400000041"

  # ── kagi: admit and mint ──────────────────────────────────────────────────
  #
  # mint_admission's GRANT operation. It holds the device-cert keyset
  # (verify_key), consults the ledger (security_state), and on success builds
  # the MintRequest from the subject it established and asks token_mint.
  # aud/scope/ttl/iss/suite are deployment params — a client asks for none,
  # so can widen none.
  - name: mint_admission
    iss: "https://issuer.token.test"
    aud: "https://rs.token.test"
    scope: "read write"
    ttl_seconds: 600
    suite: 2   # Ed25519

  - name: token_mint
    params:
      # The key-custody floor this deployment claims. `token_mint` refuses to
      # construct undeclared: where a signing key may live is a deployment
      # decision, and a default would make the weaker choice silently. An
      # example on a dev box claims `development`; a real deployment claims
      # `production` and is held to that floor.
      posture: development

  - name: security_state
    params:
      # One board, one ledger: the single-node authority. A ledger that does
      # not declare its authority refuses every request.
      authority: "single-node"

  # The control carrier (see chronicle_idp.yaml): three channels of
  # `auth_wire` envelopes.
  - name: ws
    type: ws_net
  - name: mux
    type: remote_channel
    channels: "OctetStream:tlv16:4096;OctetStream:tlv16:4096;OctetStream:tlv16:4096"
    require_peer: 0

  # ── the reply half ────────────────────────────────────────────────────────
  - name: reply
    type: pipeline
    params:
      id_field: 1
      status_field: 4
      answer: 1
      content_type: "text/plain"
      # idp.uproc's `to_token_answer`: OK → 200 + token; unavailable / no
      # clock / no key / mint-failed → 503; every presenter refusal → 400;
      # an unrecognised verdict → 503. First-hit, so the 5xx reasons are
      # named before the presenter range collapses to 400.
      ir_stages: ""
      stage_kinds: "01"
      # The body: field 2 — the token on 200, empty on every refusal.
      encode: "01000202000000616a"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  # The serving chain.
  - from: http.request_out
    to: intake.request_in
  - from: intake.result_out
    to: grant.record_in
  - from: grant.request_out
    to: mint_admission.request_in
  - from: mint_admission.response_out
    to: grant.response_in
  - from: grant.result_out
    to: reply.record_in
  - from: intake.response_out
    to: reply.response_in
  - from: reply.response_out
    to: http.response_in

  # The control carrier.
  - from: ws.tx_out
    to: http.ws_in
    buffer_group: 3
  - from: http.ws_out
    to: ws.rx_in
    buffer_group: 4
  - from: http.ws_event_out
    to: ws.event_in
  - from: ws.net_out
    to: mux.transport_in
  - from: mux.transport_out
    to: ws.net_in

  # ch0: the mint's signing key in, its announced public half back.
  - from: mux.ch0_rx
    to: token_mint.key_material
  - from: token_mint.key_announce
    to: mux.ch0
  # ch1: the device-certificate verify key.
  - from: mux.ch1_rx
    to: mint_admission.verify_key
  # ch2: the operator seeds a device record; the ack returns here.
  - from: mux.ch2_rx
    to: security_state.requests
  - from: security_state.replies
    to: mux.ch2

  # Admission ↔ ledger, and admission as the requester of the mint's exchange
  # (internal; the token never leaves kagi via the pipeline, and the subject
  # never enters it).
  - from: mint_admission.state_requests
    to: security_state.requests
  - from: security_state.replies
    to: mint_admission.state_replies
  - from: mint_admission.mint_out
    to: token_mint.request_in
  - from: token_mint.response_out
    to: mint_admission.mint_in
