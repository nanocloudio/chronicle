# The identity provider: chronicle serving an OAuth-shaped surface over kagi.
#
# There is no IdP module and there should not be one. What runs is chronicle's
# GENERIC `pipeline` engine carrying IdP-shaped params, plus kagi's identity
# modules pinned from the store. `idp.uproc` compiles to those params; nothing
# about OAuth is baked into a `.fmod`.
#
#   client ─HTTP→ http (wave)            terminates HTTP; each request an exchange
#            │ request_out
#            ↓
#          intake     pipeline           provider: id, method and target as
#            ↓                           fields, the body as the credential;
#            │                           idp.uproc's `to_kagi`
#          verify     pipeline           requester: MSG_VERIFY_REQ as the body
#            ⇅ request_out / response_in
#          token_verify (kagi)           VERIFIES, and answers 200 with a
#            ↓                           MSG_VERIFY_RESP — a TYPED verdict
#          reply      pipeline           idp.uproc's `to_answer`; carries the
#            │ response_out              intake's own refusals too
#            ↓
#          http ─HTTP→ client
#
# TWO DECISIONS, ONE PER PROTOCOL JUNCTION. The expression VM has no
# conditional, so every branch is a `decision` matching a value some other
# module produced. `to_kagi` matches the request's method and target;
# `to_answer` matches KAGI'S VERDICT — and that is the whole of `C14`. The
# pipeline cannot decide to admit something kagi refused, because the only
# thing it can branch on is what kagi said.
#
# The HTTP exchange's id rides the kagi hop in the record's carry (field 254),
# so nothing holds a table of who asked.
#
# What is NOT in this graph is the point. No credential is constructed here,
# no signature computed, no claim written, no code redeemed, no consent
# recorded. Every one of those is inside a kagi module, reached by a typed
# request. The graph routes; it does not decide who anyone is.
#
# Run it with ./run.sh. See README.md.
target: linux
tick_us: 100

# http↔linux_net and http↔engines are both request/response pairs, which is
# what a cycle IS here.
scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  # ── wave: the HTTP server ────────────────────────────────────────────────
  - name: http
    port: ${IDP_PORT:-15100}
    # 1 = downstream is `linux_net`: the kernel owns TCP segmentation.
    host_tcp: 1
    routes:
      # Key delivery, exactly as kagi's own e2e graphs do it: a websocket
      # carrying mux frames, `ch0` into `token_verify.verify_key`. The
      # keyset is an OPERATOR input, not a request input — it arrives on a
      # different port, through a different codec, and nothing on the
      # serving path can reach it. `retain_replay: false` because a key
      # frame must never replay to a fresh subscriber.
      - path: "/ws"
        websocket_fanout: true
        retain_replay: false
      # An EXACT route (no trailing slash), and the credential is the whole
      # request body — `POST /oauth/introspect` with the compact JWS as the
      # body. Nothing in this graph parses a path, a query, a form encoding
      # or a header: the method and target are fields of the exchange, and
      # the body is taken whole. A codec that parsed would be a codec that
      # could parse wrong, on bytes an attacker chose.
      #
      # The body rather than the path because a request target is bounded
      # and a real compact JWS is long — a credential in the URL is refused
      # or cut short, and either way the signature never verifies.
      #
      # It is deliberately NOT RFC 7662, which posts a form and answers a
      # JSON document. Parsing that form and assembling that document would
      # both be chronicle handling identity data. See README.md.
      - path: "/oauth/introspect"
        app: true

  # ── request path ─────────────────────────────────────────────────────────
  #
  # Every `ir_stages` value is `idp.uproc` compiled; a decision runs as an
  # inline stage (`stage_kinds: "01"`), its container from:
  #   H=$(python3 -c 'import sys;print(open(sys.argv[1],"rb").read().hex())' \
  #        examples/identity_provider/idp.uproc)
  #   fluxor exec chronicle -- graph "$H" serve  linux   # request half
  #   fluxor exec chronicle -- graph "$H" answer linux   # reply half
  #
  # The codecs are hand-written byte programs (`ser`/`rd`), because a wire
  # format is not something the document describes — the document describes
  # ROUTING. They frame only bodies: `verify`'s are `auth_wire`'s
  # `MSG_VERIFY_REQ` and `MSG_VERIFY_RESP` layouts, and if kagi changes those,
  # these change with them in the same commit (`C15`).
  - name: intake
    type: pipeline
    params:
      id_field: 1
      method_field: 2
      target_field: 3
      # The body whole (REST) as the credential, field 4. No length is read
      # out of the request: the body's extent is the exchange's own framing.
      decode: "78400400000041"
      # idp.uproc's `to_kagi`: POST to `/oauth/introspect` → OP_INTROSPECT
      # with the credential; anything else → OP_REFUSE with an EMPTY
      # credential, which kagi answers MALFORMED. Both carry the HTTP
      # exchange id in `ctx` (field 254). No `status_field`: the intake has
      # no refusal of its own to give.
      ir_stages: ""
      stage_kinds: "01"

  - name: verify
    type: pipeline
    params:
      method: 3            # POST: a typed operation's request
      # MSG_VERIFY_REQ (0x42): [type][payload_len u16] then
      #   [credential f16][expected_profile u16][expected_issuer f16]
      #   [expected_audience f16][method f8][uri f16][min_assurance u8]
      #   [now_unix_secs u64][source_class u8][flags u8]
      #
      # Every `expected_*` is empty and `min_assurance` is 0: this example
      # states no policy, which is a deliberate statement and not an
      # omission. A deployment that wants an audience rule writes it HERE,
      # in the graph, where it is reviewable — never in kagi, which enforces
      # the rule it is given and does not invent one.
      #
      # The time fields are zero. `token_verify` reads fluxor's own trusted
      # clock (B2) and refuses with NO_CLOCK if it cannot; a codec cannot
      # tell the time, and one that shipped a plausible-looking constant
      # here would be handing the verifier a forged observation.
      encode: "6001004265010002040000006462020101000204000000616002000000600200000060020000006001000060020000006001000060080000000000000000006001000060010000670201006a"
      # MSG_VERIFY_RESP (0x43) → KagiReply. Skip the envelope, take the
      # status as the verdict, then walk issuer/kid/suite to reach the
      # subject. `issuer` and `kid` are kept rather than skipped: the walk
      # has to read their lengths anyway, and a field read and thrown away
      # is a field that silently stopped being read the next time this
      # layout changes.
      reply_decode: "700300750101400300000070020075020174400500000075010174400600000070020075020174400400000041"

  # ── kagi: the verifier ───────────────────────────────────────────────────
  #
  # Pinned from the store, not vendored. A provider of the exchange
  # contract: it holds the keyset, checks the signature, the window and the
  # profile, and answers 200 with a typed `VerifiedIdentity` — refusals
  # included. Nothing above or below it can reach that decision.
  #
  # `verify_key` is where the keyset arrives as `MSG_KEY_ADD` frames. With
  # nothing wired to it the module holds no key and answers NO_KEY — which
  # this graph turns into 503, and which is the honest answer for an issuer
  # that has not been given an issuer. See README.md for provisioning it.
  - name: token_verify

  # ── the keyset carrier ───────────────────────────────────────────────────
  #
  # wave's `ws_net` presents the websocket as a `net_proto` session; fluxor's
  # `remote_channel` carries channels over it, each record whole against the
  # credit its receiver grants. One channel, `ch0`, and it is wired only into
  # `verify_key`.
  - name: ws
    type: ws_net

  - name: mux
    type: remote_channel
    # One channel of `auth_wire` envelopes — `[type u8][len u16 LE][payload]`,
    # which is `tlv16` — at most one record of the ring it feeds.
    channels: "OctetStream:tlv16:4096"
    # The transport is trusted as wired: the `WsFrame` envelope between
    # `ws_net` and `http` carries no session generation, so no peer identity
    # can be bound to a session through this chain. A deployment puts its
    # peer check at the upgrade, where a refusal reaches the operator as a
    # status.
    require_peer: 0

  # ── reply path ───────────────────────────────────────────────────────────
  - name: reply
    type: pipeline
    params:
      id_field: 1
      status_field: 4
      answer: 1
      # `text/plain`, and the body is the subject VERBATIM on 200 and empty
      # on every refusal. Building a JSON introspection document here would
      # be chronicle assembling an identity record out of parts, which is
      # exactly the thing `C14` says it must not do.
      content_type: "text/plain"
      # idp.uproc's `to_answer`: every `verify_err` value → an HTTP status,
      # with a fail-closed 503 default, answered to the exchange the carry
      # names. This is the C14 junction — the ONLY thing it can branch on is
      # kagi's verdict.
      ir_stages: ""
      stage_kinds: "01"
      # The body: field 2.
      encode: "01000202000000616a"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  # The serving chain. Exchange edges are mailbox edges Fluxor frames on its
  # own; the record edges between pipeline nodes are sized by the pipeline's
  # ports (4096 bytes), which a compact JWS and its carry fit with room.
  - from: http.request_out
    to: intake.request_in
  - from: intake.result_out
    to: verify.record_in
  - from: verify.request_out
    to: token_verify.request_in
  - from: token_verify.response_out
    to: verify.response_in
  - from: verify.result_out
    to: reply.record_in
  # The intake's own answers (a request it could not collect, or whose record
  # failed) reach `http` through `reply`, whose `response_out` is the one
  # producer `http.response_in` takes.
  - from: intake.response_out
    to: reply.response_in
  - from: reply.response_out
    to: http.response_in

  # The control carrier: http ⇄ ws_net ⇄ remote_channel. `WsFrame` is a
  # record envelope, so both http edges are mailbox mode — without it the
  # channel is a byte FIFO and a consumer can be handed part of an envelope
  # and read a length that is not there. Distinct groups: the directions are
  # independent channels.
  - from: ws.tx_out
    to: http.ws_in
    buffer_group: 3
  - from: http.ws_out
    to: ws.rx_in
    buffer_group: 4
  # The upgrade and the close: `ws_net` opens a session when `http` commits
  # the upgrade, which is what lets `remote_channel` greet first.
  - from: http.ws_event_out
    to: ws.event_in
  - from: ws.net_out
    to: mux.transport_in
  - from: mux.transport_out
    to: ws.net_in

  # The verifying keyset into kagi. This is the ONLY edge into `verify_key`.
  - from: mux.ch0_rx
    to: token_verify.verify_key
