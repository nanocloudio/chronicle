# The identity provider: POST /oauth/authorize (the OIDC authorization-code
# FIRST leg), chronicle over kagi.
#
# The companion to chronicle_exchange.yaml. This routes to kagi's `authcode`
# module, which authenticates the device from its certificate + DPoP proof,
# ESTABLISHES the subject (never named by the client), verifies the client's
# registered redirect_uri and clamps the requested scope, and returns a
# single-use authorization code. The pipeline splits the body into the eight
# fields authcode needs and transports them opaquely; it establishes no subject
# and mints no code.
#
#   client ─HTTP→ http (wave)             body is
#            │ request_out                 <credential>\n<proof>\n<client_id>\n
#            │                             <redirect_uri>\n<scope>\n<state>\n
#            ↓                             <code_challenge>\n<nonce>
#          intake     pipeline            provider: id, method and target as
#            ↓                            fields; the body split on '\n' into
#            │                            eight; `to_authorize`
#          authorize  pipeline            requester: MSG_AUTHORIZE_REQ as the
#            ⇅ request_out / response_in  body
#          authcode (kagi)                authenticates the device, establishes
#            ↓                            the subject, mints a single-use code
#          reply      pipeline            `to_authz_answer`; carries the
#            │ response_out               intake's own refusals too
#            ↓
#          http ─HTTP→ client
#
# TWO DECISIONS, ONE PER JUNCTION, and the second matches KAGI'S authz
# verdict. The code in the 200 body is kagi's, copied verbatim — the pipeline
# builds no code and no redirect. That is C14 for /authorize.
#
# `ir_stages` are `idp.uproc` compiled (`serve_authorize` and
# `answer_authorize`; see chronicle_idp.yaml for the command). Run it with
# ./run.sh --authorize. See README.md.
target: linux
# Ten modules: a 100 µs tick is under what one pass of them can take, so the
# tick is kagi's own e2e graphs' 500 µs.
tick_us: 500

scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  - name: http
    port: ${IDP_PORT:-15100}
    host_tcp: 1
    routes:
      - path: "/ws"
        websocket_fanout: true
        retain_replay: false
      # The authorization endpoint. The body is eight newline-separated values;
      # a codec splits them without parsing. Exact route.
      - path: "/oauth/authorize"
        app: true

  # ── the request half ─────────────────────────────────────────────────────
  - name: intake
    type: pipeline
    params:
      id_field: 1
      method_field: 2
      target_field: 3
      # rd: UNTIL_OPT '\n' ×7 (credential, proof, client_id, redirect_uri,
      # scope, state, code_challenge), REST → nonce. A short body pads with
      # empty values rather than failing, and kagi says what they are worth.
      decode: "7b0a40040000007b0a40050000007b0a40060000007b0a40070000007b0a40080000007b0a40090000007b0a400a00000078400b00000041"
      # idp.uproc's `to_authorize`: POST /oauth/authorize → AuthzCall{…8
      # fields}; anything else → an empty credential, which kagi refuses. The
      # HTTP exchange id rides in `ctx`.
      ir_stages: ""
      stage_kinds: "01"

  - name: authorize
    type: pipeline
    params:
      method: 3            # POST: a typed operation's request
      # ser: MSG_AUTHORIZE_REQ (0x39) [method="POST"][uri="/oauth/authorize"]
      # [credential f16][proof f16][client_id f8][redirect_uri f16]
      # [scope f16][state f16][code_challenge f8][nonce f16] — the method and
      # URI are the ones the DPoP proof is bound to.
      encode: ""
      # rd: MSG_AUTHORIZE_RESP (0x3A) — skip the envelope; [status u8] → 3,
      # [code f16] → 4, [redirect_uri f16] → 5, [state f16] → 6.
      reply_decode: "700300750101400300000075020174400400000075020174400500000075020174400600000041"

  # ── kagi: authenticate the device and mint a code ─────────────────────────
  #
  # authcode holds the device-cert keyset (verify_key), the client registry and
  # the code store (in security_state). It establishes the subject from the
  # certificate; the client names none. The mint exchange is wired because
  # authcode refuses to construct without it, though /authorize does not mint.
  - name: authcode
    iss: "https://issuer.authcode.test"
    aud: "https://rs.authcode.test"
    ttl_seconds: 600
    id_ttl_seconds: 300
    suite: 2   # Ed25519

  - name: token_mint
    params:
      # The key-custody floor this deployment claims. `token_mint` refuses to
      # construct undeclared: where a signing key may live is a deployment
      # decision, and a default would make the weaker choice silently. An
      # example on a dev box claims `development`; a real deployment claims
      # `production` and is held to that floor.
      posture: development

  - name: security_state
    params:
      # One board, one ledger: the single-node authority. A ledger that does
      # not declare its authority refuses every request.
      authority: "single-node"

  # The control carrier (see chronicle_idp.yaml): three channels of
  # `auth_wire` envelopes.
  - name: ws
    type: ws_net
  - name: mux
    type: remote_channel
    channels: "OctetStream:tlv16:4096;OctetStream:tlv16:4096;OctetStream:tlv16:4096"
    require_peer: 0

  # ── the reply half ────────────────────────────────────────────────────────
  - name: reply
    type: pipeline
    params:
      id_field: 1
      status_field: 4
      answer: 1
      content_type: "text/plain"
      # idp.uproc's `to_authz_answer`: OK → 200 + the code; UNAUTHENTICATED →
      # 401; unknown-client / bad-redirect / no-PKCE → 400; every 5xx reason and
      # any unrecognised verdict → 503 (the default, the safe direction).
      ir_stages: ""
      stage_kinds: "01"
      # The body: field 2 — the code on 200, empty on every refusal.
      encode: "01000202000000616a"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  # The serving chain.
  - from: http.request_out
    to: intake.request_in
  - from: intake.result_out
    to: authorize.record_in
  - from: authorize.request_out
    to: authcode.request_in
  - from: authcode.response_out
    to: authorize.response_in
  - from: authorize.result_out
    to: reply.record_in
  - from: intake.response_out
    to: reply.response_in
  - from: reply.response_out
    to: http.response_in

  # The control carrier.
  - from: ws.tx_out
    to: http.ws_in
    buffer_group: 3
  - from: http.ws_out
    to: ws.rx_in
    buffer_group: 4
  - from: http.ws_event_out
    to: ws.event_in
  - from: ws.net_out
    to: mux.transport_in
  - from: mux.transport_out
    to: ws.net_in

  # ch0: the mint's signing keys in, announced public halves back (authcode
  # refuses to construct without the mint wired; /authorize does not mint).
  - from: mux.ch0_rx
    to: token_mint.key_material
  - from: token_mint.key_announce
    to: mux.ch0
  # ch1: the device-certificate verify key — authcode authenticates the cert.
  - from: mux.ch1_rx
    to: authcode.verify_key
  # ch2: the operator seeds the client registry; the ack returns here.
  - from: mux.ch2_rx
    to: security_state.requests
  - from: security_state.replies
    to: mux.ch2

  # authcode ↔ ledger, and authcode as the requester of the mint's exchange
  # (internal).
  - from: authcode.state_requests
    to: security_state.requests
  - from: security_state.replies
    to: authcode.state_replies
  - from: authcode.mint_out
    to: token_mint.request_in
  - from: token_mint.response_out
    to: authcode.mint_in
