# TWO PIPELINES CHAINED OVER THE EXCHANGE CONTRACT.
#
# `first` is a requester: each result leaves on `request_out` as a PUBLISH
# exchange whose body is the record. `second` is a provider: it collects each
# request on `request_in`, runs the body as its record, and with `ack` answers
# on `response_out` once its own result is accepted downstream. The same wiring
# that reaches an MQTT topic or a Kafka partition reaches another pipeline, and
# the answers are what let `first` keep asking: its in-flight window is
# released only by `second`'s answers.
#
# Both stages double `amount`, so {1: id, 2: n} leaves as {1: id, 2: 4n}.
#
#   fluxor run examples/pipeline_chain/linux.yaml < records.bin
target: linux
tick_us: 100
scheduler:
  accept_cycles: true

platform:
  cli: {}

modules:
  - name: first
    type: pipeline
    params:
      # One stage: {1: id, 2: amount * 2}, as `chronicle compile-stages` emits it.
      ir_stages: "01ff23000500010100000012010000000500010200000001020000000000000011120200000013"
      method: 9            # PUBLISH
  - name: second
    type: pipeline
    params:
      ir_stages: "01ff23000500010100000012010000000500010200000001020000000000000011120200000013"
      ack: 1

wiring:
  - from: cli_in.stdin_out
    to: first.record_in
  # The exchange: requests out, answers back.
  - from: first.request_out
    to: second.request_in
  - from: second.response_out
    to: first.response_in
  - from: second.result_out
    to: cli_out.bytes_in
