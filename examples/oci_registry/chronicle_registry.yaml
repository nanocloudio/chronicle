# TIER 2 of the OCI registry: chronicle, serving the registry protocol.
#
# No registry module exists, and none should. What runs is chronicle's GENERIC
# pipeline carrying registry-shaped params, plus two connectors pinned from the
# store. `registry.uproc` compiles to the relay's one stage.
#
#   client ─HTTP→ http (wave)        terminates HTTP; each request an exchange
#            │ request_out    ▲ response_in
#            ↓                │
#          registry  pipeline        RELAY: the request HEAD's id, method and
#            │                │      target become fields, `to_s3` rewrites
#            │ request_out    │      them, and the HEAD leaves under the SAME
#            ↓                │      id; every other record passes through
#          s3        (wave)  ─┘      SigV4-signs and performs it; its answer
#                                    comes back through the relay to `http`
#
# ONE UNIFORM CHAIN, NO FORK. Every request path becomes an object key —
# `/v2/` included, whose discovery body is a SEEDED OBJECT rather than a branch
# in the graph. That is what lets a registry be a straight line.
#
# ONE EXCHANGE, END TO END. `http` chose the exchange's id; `s3` answers that
# same id, so its answer finds the client with no table anywhere. Only the
# HEAD is rewritten: a blob's body streams back as many BODY records as it
# takes, paced by the client's own credit, and is never assembled.
#
# Run it with ./run.sh, which starts both tiers. See README.md.
target: linux
tick_us: 100

# Two cycles — http↔linux_net and http↔registry↔s3 — and both are
# request/response pairs, which is what a cycle IS here.
scheduler:
  accept_cycles: true

platform:
  net: {}

modules:
  # ── wave: the HTTP server ────────────────────────────────────────────────
  - name: http
    # Ports follow the environment so two registries can run side by side, and
    # so `run.sh` has ONE source of truth for each. Fluxor substitutes
    # `${VAR:-default}` before the YAML is parsed, so the defaults are what a
    # bare `fluxor build` uses.
    port: ${REGISTRY_PORT:-15000}
    # 1 = downstream is `linux_net`: the kernel owns TCP segmentation.
    host_tcp: 1
    routes:
      # An application route: each request is an exchange on `request_out`.
      # The trailing slash makes it a prefix route, so all of `/v2/...`
      # arrives with its full target — a registry cannot key on a path it
      # was not given.
      - path: "/v2/"
        app: true

  # ── the relay ────────────────────────────────────────────────────────────
  #
  # Its one stage is `registry.uproc`'s `to_s3` decision, inline. The
  # decision container comes from:
  #   H=$(python3 -c 'import sys;print(open(sys.argv[1],"rb").read().hex())' \
  #        examples/oci_registry/registry.uproc)
  #   fluxor exec chronicle -- graph "$H" serve linux
  # and rides the stage container's code slot, `stage_kinds` naming it a
  # decision. No codec: the relay maps the HEAD's parts to fields and writes
  # them back, and never touches a body.
  - name: registry
    type: pipeline
    params:
      id_field: 1
      method_field: 2
      target_field: 3
      ir_stages: "01ff9100010500000012000100020200000010010000000000000020000d000000360001000201000000400100000010010000000000000040020000001209002f726567697374727901000203000000531f004003000000410d000000360001000201000000400100000010040000000000000040020000001209002f726567697374727901000203000000531f00400300000041"
      stage_kinds: "01"

  # ── wave: the storage connector ──────────────────────────────────────────
  #
  # Pinned from the store, not vendored. It signs each request with SigV4 —
  # which is why storage is a compiled module and not bytecode: a codec cannot
  # compute an HMAC. Points at tier 1, under an access key tier 1's credentials
  # bind to a capability on the registry bucket. `run.sh` supplies the key; the
  # empty default lets the graph build on its own, and tier 1 refuses every
  # request it signs.
  - name: s3
    params:
      # One value: where the connection goes and the `Host:` it carries.
      authority: "${S3_HOST:-127.0.0.1:19100}"
      access_key: "${S3_ACCESS_KEY:-}"
      secret: "${S3_SECRET:-}"
      region: "us-east-1"

wiring:
  - from: linux_net.net_out
    to: http.net_in
  - from: http.net_out
    to: linux_net.net_in

  # The exchange: requests in from `http` and on to `s3`; answers back the
  # same way. Exchange edges are mailbox edges, grouped by fluxor itself.
  - from: http.request_out
    to: registry.request_in
  - from: registry.request_out
    to: s3.request_in
  - from: s3.response_out
    to: registry.response_in
  - from: registry.response_out
    to: http.response_in

  - from: s3.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: s3.net_in
